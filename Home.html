<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Home</title>
  <link rel="icon" type="image/png" href="icon.png"> 
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Home Specific Polish --- */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 10;
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .auth-box h2 {
      font-size: 28px;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .auth-box input {
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      background: rgba(0,0,0,0.3);
      border: 1px solid #444;
      border-radius: 50px;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    .auth-box input:focus { border-color: #4285f4; background: rgba(0,0,0,0.5); }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    
    button {
      flex: 1;
      padding: 12px;
      border-radius: 50px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button.primary { background: #4285f4; color: white; }
    button.primary:hover { background: #357ae8; transform: translateY(-2px); }
    
    button.secondary { background: transparent; color: #888; border: 1px solid #444; }
    button.secondary:hover { color: white; border-color: white; }

    /* Logged In Header */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 70px; padding: 0 30px;
      display: none; justify-content: space-between; align-items: center;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
    }

    .user-profile { display: flex; align-items: center; gap: 15px; }
    #userAvatar {
      width: 35px; height: 35px; background: #4285f4;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-weight: bold; font-size: 14px;
    }
    
    .logout-btn {
      background: rgba(234, 67, 53, 0.1);
      color: #ea4335;
      border: 1px solid #ea4335;
      padding: 6px 15px;
      font-size: 12px;
    }
    .logout-btn:hover { background: #ea4335; color: white; }
  </style>
</head>
<body class="dark-mode">

  <canvas id="particleCanvas"></canvas>

  <header id="header">
    <div style="font-weight: 900; font-size: 20px; letter-spacing: 1px;">NEXUS</div>
    <div class="user-profile">
      <span id="headerUsername" style="color: #888;"></span>
      <div id="userAvatar">?</div>
      <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>
  </header>

  <div class="container">
    <div id="auth">
      <div class="auth-box">
        <h2>Nexus</h2>
        <p style="color: #666; margin-bottom: 25px;">Enter your credentials to access the terminal</p>
        
        <input type="email" id="email" placeholder="Email Address" />
        <input type="password" id="password" placeholder="Password" />
        
        <div class="btn-group">
          <button class="primary" onclick="login()">Login</button>
          <button class="secondary" onclick="register()">Register</button>
        </div>
      </div>
    </div>
    
    <div id="content" style="display: none;">
      <div class="auth-box" style="max-width: 500px;">
        <h2 style="color: #4285f4;">Access Granted</h2>
        <p style="margin-bottom: 30px;">All systems are operational, Commander.</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
           <button class="primary" onclick="window.location.href='games.html'">Launch Games</button>
           <button class="secondary" onclick="window.location.href='chat.html'">Open Chat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="global.js"></script> 
  <script type="module" src="auth.js"></script> 
  <script src="particles.js"></script> 
</body>
</html>
