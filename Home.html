<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Sidebar & Layout Logic --- */
    .sidebar {
      position: fixed; left: -280px; top: 0; width: 260px; height: 100vh;
      background: #111; border-right: 1px solid #333; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000; display: flex; flex-direction: column; padding: 20px;
    }
    body.logged-in .sidebar { left: 0; }
    body.logged-in .container { margin-left: 260px; width: calc(100% - 260px); }

    .nav-items { margin-top: 30px; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
    .nav-item { 
      color: #888; text-decoration: none; padding: 12px 15px; border-radius: 8px; 
      transition: 0.3s; font-weight: 500;
    }
    .nav-item:hover, .nav-item.active { background: rgba(66, 133, 244, 0.1); color: #4285f4; }

    .sidebar-footer { border-top: 1px solid #333; padding-top: 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .avatar { 
      width: 35px; height: 35px; background: #4285f4; color: white; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; 
    }

    /* --- Auth Box Polish --- */
    .container { display: flex; justify-content: center; align-items: center; height: 100vh; transition: 0.4s; }
    .auth-box {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
      padding: 40px; border-radius: 20px; width: 100%; max-width: 400px;
      text-align: center; border: 1px solid rgba(255,255,255,0.1);
    }
    .auth-box input {
      width: 100%; padding: 12px 20px; margin: 10px 0; background: rgba(0,0,0,0.3);
      border: 1px solid #444; border-radius: 50px; color: white; outline: none;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button.primary { background: #4285f4; color: white; }
    button.secondary { background: transparent; color: #888; border: 1px solid #444; }
    .logout-btn { background: #ea4335; color: white; width: 100%; }
  </style>
</head>
<body class="dark-mode">

  <canvas id="particleCanvas"></canvas>

  <nav id="sidebar" class="sidebar">
    <div style="font-weight: 900; font-size: 22px; color: white; letter-spacing: 2px;">NEXUS</div>
    <div class="nav-items">
      <a href="Home.html" class="nav-item active">🏠 Home</a>
      <a href="games.html" class="nav-item">🎮 Games</a>
      <a href="chat.html" class="nav-item">💬 Chat</a>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div id="userInitial" class="avatar">?</div>
        <span id="displayUser" style="color: white; font-weight: 500;">User</span>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div id="auth">
      <div class="auth-box">
        <h2>Authentication</h2>
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <div class="btn-group">
          <button class="primary" onclick="login()">Login</button>
          <button class="secondary" onclick="register()">Register</button>
        </div>
      </div>
    </div>
    
    <div id="content" style="display: none;">
      <div class="auth-box">
        <h2 style="color: #4285f4;">Welcome Back</h2>
        <p>System access granted. Select a module from the sidebar.</p>
      </div>
    </div>
  </div>

  <script src="global.js"></script> 
  <script type="module" src="auth.js"></script> 
  <script src="particles.js"></script> 
</body>
</html>
