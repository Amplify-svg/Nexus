<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Full Experience</title>
  <style>
    /* --- Styles --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #121212; color: white; overflow-x: hidden; }
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    
    .header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(26,26,26,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 1100; border-bottom: 1px solid #333; backdrop-filter: blur(5px); }
    .hamburger { width: 30px; height: 30px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-around; margin-right: 15px; }
    .hamburger span { width: 100%; height: 3px; background: white; border-radius: 2px; }
    
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #2c2c2c; transition: left 0.3s; z-index: 1200; display: flex; flex-direction: column; }
    .sidebar.open { left: 0; }
    .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid #3a3a3a; transition: 0.2s; color: white; }
    .nav-item:hover { background: #3a3a3a; }
    
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1150; }
    .overlay.active { opacity: 1; pointer-events: all; }

    /* --- Options Overlay --- */
    #optionsMenu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.98); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .options-content { background: #2c2c2c; padding: 30px; border-radius: 12px; border: 1px solid #444; width: 100%; max-width: 400px; }
    .option-group { margin-bottom: 20px; }
    .option-group label { display: block; margin-bottom: 8px; color: #4285f4; font-weight: bold; }
    .option-input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 4px; }
    .close-options { margin-top: 20px; padding: 10px 20px; background: #ea4335; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* --- Game Elements --- */
    .game-container { padding: 90px 20px 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; position: relative; z-index: 10; }
    .game-card { background: white; color: black; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 2px; min-width: 120px; text-align: center; }
    
    #gameView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: black; z-index: 1300; }
    #gameIframe { width: 100%; height: 100%; border: none; }
    .close-btn { position: absolute; top: 15px; right: 20px; background: #ea4335; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; z-index: 1500; }

    /* --- Chat --- */
    #chatWidget { position: absolute; top: 80px; left: 20px; width: 350px; height: 500px; background: #2c2c2c; border: 1px solid #444; border-radius: 8px; z-index: 1400; display: flex; flex-direction: column; overflow: visible; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    #chatHeader { padding: 12px; background: #4285f4; cursor: move; border-top-left-radius: 8px; border-top-right-radius: 8px; }
    #chatResizer { width: 30px; height: 30px; position: absolute; right: -5px; bottom: -5px; cursor: nwse-resize; z-index: 1410; }
    #chatShim { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1405; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
        <span id="gameUsername">User</span>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div style="padding:20px; font-weight:bold; background:#1a1a1a;">Menu</div>
    <div class="nav-item" onclick="location.href='index.html'">🏠 Home</div>
    <div class="nav-item" onclick="location.href='chat.html'">💬 Chat</div>
    <div class="nav-item" onclick="location.href='call.html'">📞 Call</div>
    <div class="nav-item" onclick="toggleOptions()">⚙️ Options</div> <div class="nav-item logout" style="margin-top:auto;" onclick="handleLogout()">🚪 Logout</div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div id="optionsMenu">
    <div class="options-content">
        <h2>Settings & Panic</h2>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #444;">
        
        <div class="option-group">
            <label>Panic Keybind (Type a key)</label>
            <input type="text" id="panicKeyInput" class="option-input" placeholder="Example: ] or Escape" maxlength="10">
        </div>

        <div class="option-group">
            <label>Panic Redirect URL</label>
            <input type="text" id="panicUrlInput" class="option-input" placeholder="https://google.com">
        </div>

        <button class="close-options" onclick="saveOptions()">Save & Close</button>
    </div>
  </div>

  <div class="game-container" id="gameGrid"></div>

  <div id="gameView">
    <button class="close-btn" onclick="closeGame()">✕ Exit Game</button>
    <div id="chatWidget">
        <div id="chatHeader">💬 Game Chat <button onclick="toggleChat()" style="float:right">_</button></div>
        <iframe id="chatIframe" src="chat.html" style="flex:1; border:none; background:white;"></iframe>
        <div id="chatShim"></div>
        <div id="chatResizer"></div>
    </div>
    <iframe id="gameIframe" src=""></iframe>
  </div>

  <script>
    /* --- Panic Button Logic --- */
    let panicKey = localStorage.getItem('panicKey') || '`'; 
    let panicUrl = localStorage.getItem('panicUrl') || 'https://www.classroom.google.com';

    // Initialize inputs in the menu
    document.getElementById('panicKeyInput').value = panicKey;
    document.getElementById('panicUrlInput').value = panicUrl;

    window.addEventListener('keydown', (e) => {
        // If the user presses the panic key anywhere on the site
        if (e.key === panicKey) {
            window.location.href = panicUrl;
        }
    });

    function toggleOptions() {
        const menu = document.getElementById('optionsMenu');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        toggleSidebar(); // Close sidebar when opening options
    }

    function saveOptions() {
        panicKey = document.getElementById('panicKeyInput').value;
        panicUrl = document.getElementById('panicUrlInput').value;
        
        localStorage.setItem('panicKey', panicKey);
        localStorage.setItem('panicUrl', panicUrl);
        
        document.getElementById('optionsMenu').style.display = 'none';
        alert('Settings Saved! Press "' + panicKey + '" to panic.');
    }

    /* --- Sidebar & Game Logic --- */
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    window.allGames = [];
    async function loadGames() {
        try {
            const r = await fetch('games.json');
            window.allGames = await r.json();
            const grid = document.getElementById('gameGrid');
            window.allGames.forEach(game => {
                const btn = document.createElement('div');
                btn.className = 'game-card';
                btn.innerText = game.label;
                btn.onclick = () => {
                    document.getElementById('gameIframe').src = game.path;
                    document.getElementById('gameView').style.display = 'block';
                };
                grid.appendChild(btn);
            });
        } catch(e) {}
    }

    function closeGame() {
        document.getElementById('gameIframe').src = '';
        document.getElementById('gameView').style.display = 'none';
    }

    /* --- Draggable/Resizable Chat (Hitbox Expanded) --- */
    const widget = document.getElementById("chatWidget");
    const resizer = document.getElementById("chatResizer");
    const shim = document.getElementById("chatShim");

    resizer.onmousedown = (e) => {
        shim.style.display = "block";
        resizer.style.width = "500px"; resizer.style.height = "500px"; // Expand hitbox
        let startW = widget.offsetWidth, startH = widget.offsetHeight, startX = e.clientX, startY = e.clientY;
        const move = (me) => {
            widget.style.width = (startW + (me.clientX - startX)) + "px";
            widget.style.height = (startH + (me.clientY - startY)) + "px";
        };
        const stop = () => {
            shim.style.display = "none";
            resizer.style.width = "30px"; resizer.style.height = "30px";
            document.removeEventListener('mousemove', move);
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stop, {once:true});
    };

    loadGames();
  </script>
</body>
</html>
