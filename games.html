<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Games</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Game Specific Styles --- */
    .search-container { margin: 100px auto 30px; max-width: 650px; padding: 0 20px; position: relative; z-index: 10; }
    #gameSearch { 
        width: 100%; padding: 15px 25px; 
        background: rgba(30,30,30,0.7); border: 1px solid #444; 
        border-radius: 50px; color: white; font-size: 16px; 
        outline: none; transition: 0.3s; backdrop-filter: blur(10px); 
    }
    
    .pinned-section { padding: 0 40px 30px; position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; }
    .pinned-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #ffd700; display: flex; align-items: center; gap: 10px; }
    
    .game-container { padding: 20px 40px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; position: relative; z-index: 10; }
    
    .game-card { 
        background: #fff; color: #000; padding: 20px 35px; cursor: pointer; 
        font-weight: 800; border-radius: 8px; min-width: 160px; text-align: center; 
        position: relative; transition: all 0.2s ease; box-shadow: 0 4px 0 #ccc; 
    }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.3); }
    .game-card.pinned { background: linear-gradient(135deg, #ffd700 0%, #ffb900 100%); box-shadow: 0 4px 0 #b8860b; }
    
    /* Pin Button for Admins */
    .pin-btn { position: absolute; top: -10px; right: -10px; background: #4285f4; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; }
    .game-card:hover .pin-btn { display: flex; }

    /* --- Game View & Floating Chat --- */
    #gameView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: black; z-index: 3000; }
    #gameIframe { width: 100%; height: 100%; border: none; }
    .close-btn { position: absolute; top: 15px; right: 20px; background: #ea4335; color: white; border: none; padding: 12px 24px; cursor: pointer; font-weight: bold; z-index: 3100; border-radius: 50px; }

    #chatWidget { position: absolute; top: 80px; left: 20px; width: 350px; height: 500px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; z-index: 3050; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    #chatHeader { padding: 12px; background: #4285f4; cursor: move; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; color: white; user-select: none; }
    #chatShim { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3055; }
    #chatResizer { width: 30px; height: 30px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 3060; }
    
    /* Options Modal */
    #optionsMenu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
    .options-box { background: #1e1e1e; padding: 40px; border-radius: 16px; border: 1px solid #444; width: 90%; max-width: 450px; }
    .option-input { width: 100%; padding: 12px; margin: 10px 0 20px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; }
  </style>
</head>
<body class="dark-mode">

  <canvas id="particleCanvas"></canvas>
  <script src="global.js"></script>

  <div id="optionsMenu">
    <div class="options-box">
        <h2 style="color:white; margin-bottom:20px;">Game Preferences</h2>
        <label style="color:#888; font-size:12px;">PANIC KEY</label>
        <input type="text" id="panicKeyInput" class="option-input">
        <label style="color:#888; font-size:12px;">REDIRECT URL</label>
        <input type="text" id="panicUrlInput" class="option-input">
        <button class="option-input" style="background:#4285f4; color:white; border:none; cursor:pointer;" onclick="saveOptions()">Save Changes</button>
        <button class="option-input" style="background:transparent; color:#666; border:none; cursor:pointer;" onclick="toggleOptions()">Cancel</button>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="gameSearch" placeholder="Search Nexus Games..." onkeyup="filterGames()">
  </div>
  
  <div id="pinnedSection" class="pinned-section" style="display: none;">
    <div class="pinned-title">📌 Featured</div>
    <div id="pinnedGrid" class="game-container" style="padding:0; justify-content: flex-start;"></div>
  </div>
  
  <div id="gameGrid" class="game-container"></div>

  <div id="gameView">
    <button class="close-btn" onclick="closeGame()">✕ Exit Game</button>
    
    <div id="chatWidget">
        <div id="chatHeader" id="chatHeader">
            <span style="font-size:12px; font-weight:bold;">Nexus Live Chat</span>
            <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">—</button>
        </div>
        <iframe id="chatIframe" src="chat.html" style="flex:1; border:none; background:white;"></iframe>
        <div id="chatShim"></div>
        <div id="chatResizer"></div>
    </div>
    
    <iframe id="gameIframe" src=""></iframe>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, child, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    onAuthStateChanged(auth, async user => {
      if (user) {
        const snap = await get(child(ref(database), `users/${user.uid}`));
        if (snap.exists()) {
          const data = snap.val();
          window.isAdmin = data.isAdmin === true;
          
          // Sync Sidebar Avatar and Username
          const userInit = document.getElementById('userInitial');
          if(userInit) userInit.textContent = data.username[0].toUpperCase();
          
          const userInfo = document.querySelector('.user-info');
          if(userInfo && !document.getElementById('displayUser')) {
            userInfo.insertAdjacentHTML('afterbegin', `<span id="displayUser" style="margin-right:10px; font-weight:500; color:#4285f4;">${data.username}</span>`);
          }
        }
        // Sync Pinned Games
        onValue(ref(database, 'pinnedGames'), (s) => {
          window.pinnedLabels = s.val() || [];
          if(window.allGames.length) renderGames(window.allGames);
        });
      } else { window.location.href = 'Home.html'; }
    });

    window.togglePin = async (label) => {
      if (!window.isAdmin) return;
      let pins = [...window.pinnedLabels];
      const idx = pins.indexOf(label);
      idx > -1 ? pins.splice(idx, 1) : pins.push(label);
      await set(ref(database, 'pinnedGames'), pins);
    };
  </script>

  <script>
    /* --- Layout Integration --- */
    document.addEventListener('DOMContentLoaded', () => {
        const navItems = document.querySelector('.nav-items');
        if (navItems) {
            const optBtn = document.createElement('a');
            optBtn.className = 'nav-item';
            optBtn.innerHTML = '🛡️ Game Options';
            optBtn.href = '#';
            optBtn.onclick = (e) => { e.preventDefault(); toggleOptions(); };
            navItems.appendChild(optBtn);
        }
    });

    /* --- Panic & Settings --- */
    let panicKey = localStorage.getItem('pKey') || '`';
    let panicUrl = localStorage.getItem('pUrl') || 'https://classroom.google.com';
    window.allGames = [];
    window.pinnedLabels = [];

    window.addEventListener('keydown', (e) => { if(e.key === panicKey) window.location.replace(panicUrl); });

    function toggleOptions() {
      const m = document.getElementById('optionsMenu');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
      document.getElementById('panicKeyInput').value = panicKey;
      document.getElementById('panicUrlInput').value = panicUrl;
    }

    function saveOptions() {
      panicKey = document.getElementById('panicKeyInput').value;
      panicUrl = document.getElementById('panicUrlInput').value;
      localStorage.setItem('pKey', panicKey);
      localStorage.setItem('pUrl', panicUrl);
      toggleOptions();
    }

    /* --- Game Management --- */
    async function loadGames() {
      try {
        const r = await fetch('games.json');
        window.allGames = await r.json();
        renderGames(window.allGames);
      } catch (e) { console.error("games.json not found"); }
    }

    function renderGames(list) {
      const q = document.getElementById('gameSearch').value.toLowerCase();
      const filtered = list.filter(g => g.label.toLowerCase().includes(q));
      const grid = document.getElementById('gameGrid'), pGrid = document.getElementById('pinnedGrid'), pSec = document.getElementById('pinnedSection');
      
      grid.innerHTML = ''; pGrid.innerHTML = '';
      const pinned = filtered.filter(g => window.pinnedLabels.includes(g.label));
      const unpinned = filtered.filter(g => !window.pinnedLabels.includes(g.label));
      
      pSec.style.display = pinned.length ? 'block' : 'none';
      pinned.forEach(g => createCard(g, pGrid, true));
      unpinned.forEach(g => createCard(g, grid, false));
    }

    function createCard(game, container, isPinned) {
      const btn = document.createElement('div');
      btn.className = 'game-card' + (isPinned ? ' pinned' : '');
      btn.innerText = game.label.replace(/^cl/i, '');
      
      // Admin Pin Button
      if (window.isAdmin) {
        const pBtn = document.createElement('button');
        pBtn.className = 'pin-btn'; pBtn.innerHTML = isPinned ? '✕' : '📌';
        pBtn.onclick = (e) => { e.stopPropagation(); window.togglePin(game.label); };
        btn.appendChild(pBtn);
      }
      
      btn.onclick = () => {
        document.getElementById('gameIframe').src = game.path;
        document.getElementById('gameView').style.display = 'block';
        document.body.style.overflow = 'hidden';
      };
      container.appendChild(btn);
    }

    function filterGames() { renderGames(window.allGames); }
    function closeGame() { 
        document.getElementById('gameIframe').src = ''; 
        document.getElementById('gameView').style.display = 'none'; 
        document.body.style.overflow = 'auto'; 
    }

    /* --- DRAG & RESIZE LOGIC --- */
    const widget = document.getElementById("chatWidget"), header = document.getElementById("chatHeader");
    const resizer = document.getElementById("chatResizer"), shim = document.getElementById("chatShim");

    header.onmousedown = (e) => {
        if(e.target.tagName === 'BUTTON') return;
        shim.style.display = "block"; // Prevents iframe from stealing focus
        let ox = e.clientX - widget.offsetLeft, oy = e.clientY - widget.offsetTop;
        const move = (m) => { widget.style.left = (m.clientX - ox) + "px"; widget.style.top = (m.clientY - oy) + "px"; };
        const stop = () => { shim.style.display = "none"; document.removeEventListener('mousemove', move); };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stop, {once:true});
    };

    resizer.onmousedown = (e) => {
        shim.style.display = "block";
        let sw = widget.offsetWidth, sh = widget.offsetHeight, sx = e.clientX, sy = e.clientY;
        const move = (m) => {
            const nw = sw + (m.clientX - sx), nh = sh + (m.clientY - sy);
            if(nw > 200) widget.style.width = nw + "px";
            if(nh > 100) widget.style.height = nh + "px";
        };
        const stop = () => { shim.style.display = "none"; document.removeEventListener('mousemove', move); };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stop, {once:true});
    };

    function toggleChat() {
        const chat = document.getElementById('chatIframe');
        const isHidden = chat.style.display === 'none';
        chat.style.display = isHidden ? 'block' : 'none';
        widget.style.height = isHidden ? '500px' : '45px';
    }

    loadGames();
  </script>
  <script src="particles.js"></script>
</body>
</html>
