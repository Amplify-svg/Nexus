<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Full Experience</title>
  <style>
    /* --- Previous Styles --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #121212; color: white; overflow-x: hidden; }
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    
    .header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(26,26,26,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 1100; border-bottom: 1px solid #333; backdrop-filter: blur(5px); }
    .hamburger { width: 30px; height: 30px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-around; margin-right: 15px; }
    .hamburger span { width: 100%; height: 3px; background: white; border-radius: 2px; }
    .user-info { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; background: #4285f4; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #2c2c2c; transition: left 0.3s; z-index: 1200; display: flex; flex-direction: column; }
    .sidebar.open { left: 0; }
    .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid #3a3a3a; transition: 0.2s; color: white; }
    .nav-item:hover { background: #3a3a3a; }
    
    /* Bottom menu items */
    .sidebar-bottom { margin-top: auto; border-top: 2px solid #444; }
    .nav-item.logout { background: #ea4335; }
    .nav-item.logout:hover { background: #d33828; }
    
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1150; }
    .overlay.active { opacity: 1; pointer-events: all; }

    /* Game Layout */
    .search-container { margin: 90px auto 20px; max-width: 600px; padding: 0 20px; position: relative; z-index: 10; }
    #gameSearch { width: 100%; padding: 12px 20px; background: rgba(44,44,44,0.8); border: 2px solid #444; border-radius: 4px; color: white; font-size: 16px; outline: none; }
    
    .pinned-section { padding: 20px; position: relative; z-index: 10; }
    .pinned-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ffd700; }
    .pinned-games { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
    
    .game-container { padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; position: relative; z-index: 10; }
    .game-card { background: white; color: black; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 2px; min-width: 120px; text-align: center; position: relative; }
    .game-card.pinned { background: linear-gradient(135deg, #ffd700, #ffed4e); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); }
    
    .pin-btn { 
      position: absolute; top: 5px; right: 5px; background: #ffd700; 
      border: none; border-radius: 50%; width: 25px; height: 25px; 
      cursor: pointer; font-size: 14px; display: none;
    }
    .game-card:hover .pin-btn { display: block; }
    .game-card.pinned .pin-btn { display: block; background: #ff4444; }

    /* Game View System */
    #gameView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: black; z-index: 1300; }
    #gameIframe { width: 100%; height: 100%; border: none; }
    .close-btn { position: absolute; top: 15px; right: 20px; background: #ea4335; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; z-index: 1500; }

    /* --- FLOATING CHAT WIDGET STYLES --- */
    #chatWidget {
      position: absolute; top: 80px; left: 20px; width: 320px; height: 450px;
      min-width: 200px; min-height: 100px; background: #2c2c2c; 
      border: 1px solid #444; border-radius: 8px; z-index: 1400; 
      display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;
    }
    #chatHeader { padding: 12px; background: #4285f4; cursor: move; font-weight: bold; display: flex; justify-content: space-between; color: white; user-select: none; }
    #chatIframe { flex: 1; border: none; background: white; }
    .min-btn { cursor: pointer; background: rgba(0,0,0,0.2); border: none; color: white; padding: 0 10px; border-radius: 3px; }
    #chatResizeHandle { width: 20px; height: 20px; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 1501; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
    <div class="user-info"><div class="avatar" id="gameUserAvatar">U</div><span id="gameUsername">User</span></div>
  </div>

  <div class="sidebar" id="sidebar">
    <div style="padding:20px; font-weight:bold; background:#1a1a1a;">Menu</div>
    <div class="nav-item" onclick="window.location.href='index.html'">🏠 Home</div>
    <div class="nav-item" onclick="window.location.href='chat.html'">💬 Chat</div>
    <div class="nav-item" onclick="window.location.href='games.html'">🎮 Games</div>
    
    <div class="sidebar-bottom">
      <div class="nav-item" onclick="window.location.href='settings.html'">⚙️ Settings</div>
      <div class="nav-item logout" onclick="handleLogout()">🚪 Logout</div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="search-container">
    <input type="text" id="gameSearch" placeholder="Search games..." onkeyup="filterGames()">
  </div>
  
  <div id="pinnedSection" class="pinned-section" style="display: none;">
    <div class="pinned-title">📌 Pinned Games</div>
    <div class="pinned-games" id="pinnedGrid"></div>
  </div>
  
  <div class="game-container" id="gameGrid"></div>

  <div id="gameView">
    <button class="close-btn" onclick="closeGame()">✕ Exit Game</button>
    
    <div id="chatWidget">
        <div id="chatHeader">
          <span>💬 Game Chat</span>
          <button class="min-btn" onclick="toggleChat()">_</button>
        </div>
        <iframe id="chatIframe" src="chat.html"></iframe>
        <div id="chatResizeHandle"></div>
    </div>

    <iframe id="gameIframe" src=""></iframe>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, child, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const dbRef = ref(database);

    let currentUser = null;
    let isAdmin = false;
    let pinnedGames = [];

    // Load pinned games from Firebase
    function loadPinnedGames() {
      onValue(ref(database, 'pinnedGames'), (snap) => {
        pinnedGames = snap.val() || [];
        renderGames(allGames);
      });
    }

    // Toggle pin status
    window.togglePin = async (gameLabel) => {
      if (!isAdmin) return;
      
      const index = pinnedGames.indexOf(gameLabel);
      if (index > -1) {
        pinnedGames.splice(index, 1);
      } else {
        pinnedGames.push(gameLabel);
      }
      
      await set(ref(database, 'pinnedGames'), pinnedGames);
    };

    // Load user info from Firebase
    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        const snap = await get(child(dbRef, `users/${user.uid}`));
        if (snap.exists()) {
          const data = snap.val();
          isAdmin = data.isAdmin === true;
          document.getElementById("gameUsername").textContent = data.username;
          document.getElementById("gameUserAvatar").textContent = data.username[0].toUpperCase();
          loadPinnedGames();
        } else {
          const username = user.email.split('@')[0];
          document.getElementById("gameUsername").textContent = username;
          document.getElementById("gameUserAvatar").textContent = username[0].toUpperCase();
          loadPinnedGames();
        }
      } else {
        window.location.href = 'index.html';
      }
    });

    // Logout function with Firebase
    window.handleLogout = () => {
      const sidebar = document.getElementById("sidebar");
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => {
          if (sidebar.classList.contains("open")) {
            toggleSidebar();
          }
          window.location.href = 'index.html';
        }).catch((error) => {
          console.error('Logout error:', error);
          alert('Error logging out. Please try again.');
        });
      }
    };
  </script>

  <script>
    /* --- Game Loading & Sidebar Logic --- */
    let allGames = [];
    let pinnedGames = []; // Initialize here in main script scope
    
    async function loadGames() {
      try {
        const response = await fetch('games.json');
        allGames = await response.json();
        renderGames(allGames);
      } catch (e) { console.error("Error loading games.json"); }
    }

    function renderGames(list) {
      const grid = document.getElementById('gameGrid');
      const pinnedGrid = document.getElementById('pinnedGrid');
      const pinnedSection = document.getElementById('pinnedSection');
      
      grid.innerHTML = '';
      pinnedGrid.innerHTML = '';
      
      // Separate pinned and unpinned games
      const pinned = list.filter(g => pinnedGames.includes(g.label));
      const unpinned = list.filter(g => !pinnedGames.includes(g.label));
      
      // Show pinned section only if there are pinned games
      if (pinned.length > 0) {
        pinnedSection.style.display = 'block';
        pinned.forEach(game => createGameCard(game, pinnedGrid, true));
      } else {
        pinnedSection.style.display = 'none';
      }
      
      // Render unpinned games
      unpinned.forEach(game => createGameCard(game, grid, false));
    }

    function createGameCard(game, container, isPinned) {
      const btn = document.createElement('div');
      btn.className = 'game-card' + (isPinned ? ' pinned' : '');
      let label = game.label.toLowerCase();
      if (label.startsWith('cl')) label = label.slice(2);
      btn.innerText = label;
      
      // Add pin button for admins
      if (isAdmin) {
        const pinBtn = document.createElement('button');
        pinBtn.className = 'pin-btn';
        pinBtn.innerHTML = isPinned ? '✕' : '📌';
        pinBtn.title = isPinned ? 'Unpin' : 'Pin';
        pinBtn.onclick = (e) => {
          e.stopPropagation();
          togglePin(game.label);
        };
        btn.appendChild(pinBtn);
      }
      
      btn.onclick = () => {
        document.getElementById('gameIframe').src = game.path;
        document.getElementById('gameView').style.display = 'block';
        document.body.style.overflow = 'hidden';
      };
      container.appendChild(btn);
    }

    function filterGames() {
      const q = document.getElementById('gameSearch').value.toLowerCase();
      renderGames(allGames.filter(g => g.label.toLowerCase().includes(q)));
    }

    function closeGame() {
      document.getElementById('gameIframe').src = '';
      document.getElementById('gameView').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    /* --- Floating Chat Widget Logic --- */
    const widget = document.getElementById("chatWidget");
    const header = document.getElementById("chatHeader");
    const handle = document.getElementById("chatResizeHandle");
    const chatIframe = document.getElementById("chatIframe");

    function toggleChat() {
      const isHidden = chatIframe.style.display === "none";
      chatIframe.style.display = isHidden ? "block" : "none";
      widget.style.height = isHidden ? "450px" : "45px";
    }

    let activeAction = null; 
    let startX, startY, startW, startH, startL, startT;

    /* --- Particle Background & Interaction Logic --- */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    
    let mouse = {
        x: null,
        y: null,
        radius: 120
    };

    window.addEventListener('mousemove', (event) => {
        mouse.x = event.x;
        mouse.y = event.y;
    });

    window.addEventListener('touchmove', (event) => {
        mouse.x = event.touches[0].clientX;
        mouse.y = event.touches[0].clientY;
    });

    window.addEventListener('mouseout', () => {
        mouse.x = undefined;
        mouse.y = undefined;
    });

    let lastVibrate = 0;
    function triggerHaptic() {
        if (!navigator.vibrate) return;
        const now = Date.now();
        if (now - lastVibrate > 50) {
            navigator.vibrate(5);
            lastVibrate = now;
        }
    }

    let particles = [];
    
    function resize() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
    }
    
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width; 
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5; 
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 1;
        this.baseX = this.x;
        this.baseY = this.y;
        this.density = (Math.random() * 30) + 1; 
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (mouse.x != undefined && mouse.y != undefined) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < mouse.radius) {
                if (distance < mouse.radius - 20) {
                    triggerHaptic();
                }

                const forceDirectionX = dx / distance;
                const forceDirectionY = dy / distance;
                const maxDistance = mouse.radius;
                const force = (maxDistance - distance) / maxDistance;
                
                const directionX = forceDirectionX * force * this.density;
                const directionY = forceDirectionY * force * this.density;

                this.x -= directionX;
                this.y -= directionY;
            }
        }

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
    }

    function init() { 
      resize(); 
      particles = Array.from({length: 100}, () => new Particle()); 
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const color = '255, 255, 255';
      
      particles.forEach((p, i) => {
        p.update();
        
        ctx.fillStyle = `rgba(${color}, 0.7)`; 
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); 
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = p.x - particles[j].x;
          const dy = p.y - particles[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 120) {
            ctx.strokeStyle = `rgba(${color}, ${(1 - dist/120) * 0.5})`; 
            ctx.lineWidth = 1;
            ctx.beginPath(); 
            ctx.moveTo(p.x, p.y); 
            ctx.lineTo(particles[j].x, particles[j].y); 
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
      resize();
      init();
    });
    
    init(); 
    animate();
    loadGames();
  </script>
</body>
</html>
