<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Full Experience</title>
  <style>
    /* --- Styles Kept Intact --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #121212; color: white; overflow-x: hidden; }
    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    
    .header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(26,26,26,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 1100; border-bottom: 1px solid #333; backdrop-filter: blur(5px); }
    .hamburger { width: 30px; height: 30px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-around; margin-right: 15px; }
    .hamburger span { width: 100%; height: 3px; background: white; border-radius: 2px; }
    .user-info { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; background: #4285f4; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #2c2c2c; transition: left 0.3s; z-index: 1200; display: flex; flex-direction: column; }
    .sidebar.open { left: 0; }
    .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid #3a3a3a; transition: 0.2s; color: white; }
    .nav-item:hover { background: #3a3a3a; }
    
    .sidebar-bottom { margin-top: auto; border-top: 2px solid #444; }
    .nav-item.logout { background: #ea4335; }
    .nav-item.logout:hover { background: #d33828; }
    
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1150; }
    .overlay.active { opacity: 1; pointer-events: all; }

    .search-container { margin: 90px auto 20px; max-width: 600px; padding: 0 20px; position: relative; z-index: 10; }
    #gameSearch { width: 100%; padding: 12px 20px; background: rgba(44,44,44,0.8); border: 2px solid #444; border-radius: 4px; color: white; font-size: 16px; outline: none; }
    
    .pinned-section { padding: 20px; position: relative; z-index: 10; }
    .pinned-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ffd700; }
    .pinned-games { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
    
    .game-container { padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; position: relative; z-index: 10; }
    .game-card { background: white; color: black; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 2px; min-width: 120px; text-align: center; position: relative; }
    .game-card.pinned { background: linear-gradient(135deg, #ffd700, #ffed4e); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); }
    
    .pin-btn { position: absolute; top: 5px; right: 5px; background: #ffd700; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 14px; display: none; }
    .game-card:hover .pin-btn { display: block; }
    .game-card.pinned .pin-btn { display: block; background: #ff4444; }

    #gameView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: black; z-index: 1300; }
    #gameIframe { width: 100%; height: 100%; border: none; }
    .close-btn { position: absolute; top: 15px; right: 20px; background: #ea4335; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; z-index: 1500; }

    /* --- Chat Widget Styles --- */
    #chatWidget { position: absolute; top: 80px; left: 20px; width: 320px; height: 450px; background: #2c2c2c; border: 1px solid #444; border-radius: 8px; z-index: 1400; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; min-width: 200px; min-height: 45px; }
    #chatHeader { padding: 12px; background: #4285f4; cursor: move; font-weight: bold; display: flex; justify-content: space-between; color: white; user-select: none; flex-shrink: 0; }
    #chatIframe { flex: 1; border: none; background: white; }
    .min-btn { cursor: pointer; background: rgba(0,0,0,0.2); border: none; color: white; padding: 0 10px; border-radius: 3px; }

    /* Resizer and Shim */
    #chatResizer { width: 15px; height: 15px; background: transparent; position: absolute; right: 0; bottom: 0; cursor: nwse-resize; z-index: 1410; }
    #chatShim { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1405; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
    <div class="user-info"><div class="avatar" id="gameUserAvatar">U</div><span id="gameUsername">User</span></div>
  </div>

  <div class="sidebar" id="sidebar">
    <div style="padding:20px; font-weight:bold; background:#1a1a1a;">Menu</div>
    <div class="nav-item" onclick="window.location.href='index.html'">🏠 Home</div>
    <div class="nav-item" onclick="window.location.href='chat.html'">💬 Chat</div>
    <div class="nav-item" onclick="window.location.href='games.html'">🎮 Games</div>
    <div class="sidebar-bottom">
      <div class="nav-item" onclick="window.location.href='settings.html'">⚙️ Settings</div>
      <div class="nav-item logout" onclick="handleLogout()">🚪 Logout</div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="search-container">
    <input type="text" id="gameSearch" placeholder="Search games..." onkeyup="filterGames()">
  </div>
  
  <div id="pinnedSection" class="pinned-section" style="display: none;">
    <div class="pinned-title">📌 Pinned Games</div>
    <div class="pinned-games" id="pinnedGrid"></div>
  </div>
  
  <div class="game-container" id="gameGrid"></div>

  <div id="gameView">
    <button class="close-btn" onclick="closeGame()">✕ Exit Game</button>
    
    <div id="chatWidget">
        <div id="chatHeader">
          <span>💬 Game Chat</span>
          <button class="min-btn" onclick="toggleChat()">_</button>
        </div>
        <iframe id="chatIframe" src="chat.html"></iframe>
        <div id="chatShim"></div>
        <div id="chatResizer"></div>
    </div>

    <iframe id="gameIframe" src=""></iframe>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, child, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const dbRef = ref(database);

    window.isAdmin = false;
    window.pinnedGames = [];

    function listenToPinnedGames() {
      onValue(ref(database, 'pinnedGames'), (snap) => {
        window.pinnedGames = snap.val() || [];
        if(window.allGames) renderGames(window.allGames);
      });
    }

    window.togglePin = async (gameLabel) => {
      if (!window.isAdmin) return;
      let updatedPins = [...window.pinnedGames];
      const index = updatedPins.indexOf(gameLabel);
      if (index > -1) {
        updatedPins.splice(index, 1);
      } else {
        updatedPins.push(gameLabel);
      }
      await set(ref(database, 'pinnedGames'), updatedPins);
    };

    onAuthStateChanged(auth, async user => {
      if (user) {
        const snap = await get(child(dbRef, `users/${user.uid}`));
        if (snap.exists()) {
          const data = snap.val();
          window.isAdmin = data.isAdmin === true;
          document.getElementById("gameUsername").textContent = data.username;
          document.getElementById("gameUserAvatar").textContent = data.username[0].toUpperCase();
        }
        listenToPinnedGames();
      } else {
        window.location.href = 'index.html';
      }
    });

    window.handleLogout = () => {
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => {
          window.location.href = 'index.html';
        });
      }
    };
  </script>

  <script>
    /* --- Game Logic --- */
    window.allGames = [];
    
    async function loadGames() {
      try {
        const response = await fetch('games.json');
        window.allGames = await response.json();
        renderGames(window.allGames);
      } catch (e) { console.error("Error loading games.json"); }
    }

    function renderGames(list) {
      const grid = document.getElementById('gameGrid');
      const pinnedGrid = document.getElementById('pinnedGrid');
      const pinnedSection = document.getElementById('pinnedSection');
      
      grid.innerHTML = '';
      pinnedGrid.innerHTML = '';
      
      const pinned = list.filter(g => window.pinnedGames.includes(g.label));
      const unpinned = list.filter(g => !window.pinnedGames.includes(g.label));
      
      if (pinned.length > 0) {
        pinnedSection.style.display = 'block';
        pinned.forEach(game => createGameCard(game, pinnedGrid, true));
      } else {
        pinnedSection.style.display = 'none';
      }
      
      unpinned.forEach(game => createGameCard(game, grid, false));
    }

    function createGameCard(game, container, isPinned) {
      const btn = document.createElement('div');
      btn.className = 'game-card' + (isPinned ? ' pinned' : '');
      let labelText = game.label;
      if (labelText.toLowerCase().startsWith('cl')) labelText = labelText.slice(2);
      btn.innerText = labelText;
      
      if (window.isAdmin) {
        const pinBtn = document.createElement('button');
        pinBtn.className = 'pin-btn';
        pinBtn.innerHTML = isPinned ? '✕' : '📌';
        pinBtn.onclick = (e) => {
          e.stopPropagation();
          window.togglePin(game.label);
        };
        btn.appendChild(pinBtn);
      }
      
      btn.onclick = () => {
        document.getElementById('gameIframe').src = game.path;
        document.getElementById('gameView').style.display = 'block';
        document.body.style.overflow = 'hidden';
      };
      container.appendChild(btn);
    }

    window.filterGames = () => {
      const q = document.getElementById('gameSearch').value.toLowerCase();
      renderGames(window.allGames.filter(g => g.label.toLowerCase().includes(q)));
    };

    window.closeGame = () => {
      document.getElementById('gameIframe').src = '';
      document.getElementById('gameView').style.display = 'none';
      document.body.style.overflow = 'auto';
    };

    window.toggleSidebar = () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    };

    // --- Enhanced Drag & Resize Logic ---
    const chatWidget = document.getElementById("chatWidget");
    const chatHeader = document.getElementById("chatHeader");
    const chatResizer = document.getElementById("chatResizer");
    const chatShim = document.getElementById("chatShim");
    const chatIframe = document.getElementById("chatIframe");

    window.toggleChat = () => {
      const isHidden = chatIframe.style.display === "none";
      chatIframe.style.display = isHidden ? "block" : "none";
      chatWidget.style.height = isHidden ? "450px" : "45px";
    };

    let isDragging = false;
    let isResizing = false;

    // Draggable Header Logic
    chatHeader.onmousedown = (e) => {
        if (e.target.classList.contains('min-btn')) return;
        isDragging = true;
        chatShim.style.display = "block"; // Shim blocks iframe focus
        let startX = e.clientX - chatWidget.offsetLeft;
        let startY = e.clientY - chatWidget.offsetTop;

        const onMouseMove = (moveEvent) => {
            if (!isDragging) return;
            chatWidget.style.left = (moveEvent.clientX - startX) + "px";
            chatWidget.style.top = (moveEvent.clientY - startY) + "px";
        };

        const onMouseUp = () => {
            isDragging = false;
            chatShim.style.display = "none";
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    };

    // Resizable Corner Logic
    chatResizer.onmousedown = (e) => {
        isResizing = true;
        chatShim.style.display = "block";
        let startWidth = chatWidget.offsetWidth;
        let startHeight = chatWidget.offsetHeight;
        let startX = e.clientX;
        let startY = e.clientY;

        const onMouseMove = (moveEvent) => {
            if (!isResizing) return;
            // Larger hitbox logic: calculate based on mouse movement relative to start
            const newWidth = startWidth + (moveEvent.clientX - startX);
            const newHeight = startHeight + (moveEvent.clientY - startY);

            if (newWidth > 200) chatWidget.style.width = newWidth + "px";
            if (newHeight > 45) chatWidget.style.height = newHeight + "px";
        };

        const onMouseUp = () => {
            isResizing = false;
            chatShim.style.display = "none";
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    };

    // --- Particle System ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = 2;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    for(let i=0; i<80; i++) particles.push(new Particle());
    animate();
    loadGames();
  </script>
</body>
</html>
