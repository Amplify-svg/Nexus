<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Chat Layout --- */
    #chatBox {
      position: absolute; top: 70px; left: 0; right: 0; bottom: 85px;
      padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      z-index: 2;
    }
    
    #typingIndicator {
      position: fixed; bottom: 85px; left: 20px; font-size: 12px;
      font-style: italic; color: #888; height: 15px; z-index: 5;
    }

    /* Message Bubbles */
    .message {
      padding: 10px 15px; border-radius: 18px; max-width: 75%;
      word-wrap: break-word; animation: messageFade 0.3s ease; position: relative;
    }
    /* Theme-aware bubbles */
    .message.own { background: #4285f4; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.other { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    body.dark-mode .message.other { background: #333; color: white; }

    /* Admin Specials */
    .message.admin-gradient {
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      background-size: 300% 300%;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
      color: white !important;
    }
    .message.admin-gradient.animate { animation: gradientShift 6s ease infinite; }

    @keyframes messageFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .message-user { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; position: relative; }
    .admin-viewable { text-decoration: underline dotted #4285f4; cursor: help; }

    /* Admin Tooltip */
    .admin-tooltip {
      visibility: hidden; width: 180px; background-color: #222; color: #fff;
      text-align: center; border-radius: 6px; padding: 10px;
      position: absolute; z-index: 100; bottom: 125%; left: 0;
      opacity: 0; transition: opacity 0.2s; border: 1px solid #444; font-weight: normal; font-size: 11px;
    }
    .message-user:hover .admin-tooltip { visibility: visible; opacity: 1; }

    /* Input Bar Theme-Aware */
    #messageInputBox {
      position: fixed; left: 0; right: 0; bottom: 0; height: 80px;
      padding: 15px 20px; background: rgba(255,255,255,0.95);
      display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; z-index: 10;
      backdrop-filter: blur(10px);
    }
    body.dark-mode #messageInputBox { background: rgba(20,20,20,0.95); border-top: 1px solid #333; }

    #messageInput { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #ddd; outline: none; }
    body.dark-mode #messageInput { background: #111; color: white; border-color: #444; }

    /* Member List Drawer */
    #memberList {
      position: fixed; right: -320px; top: 0; width: 300px; height: 100vh;
      background: white; border-left: 1px solid #ddd; transition: 0.3s; z-index: 4000; padding: 20px;
      display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    }
    body.dark-mode #memberList { background: #1a1a1a; border-left: 1px solid #333; color: white; }
    #memberList.open { right: 0; }
    .member-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(128,128,128,0.2); }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>
  <script src="global.js"></script>

  <div id="memberList">
    <button style="background:none; border:none; font-size:24px; cursor:pointer; color:inherit; align-self:flex-end;" onclick="toggleMemberList()">×</button>
    <h3 style="margin-bottom:15px;">Online Members (<span id="onlineCount">0</span>)</h3>
    <div id="memberListContent" style="overflow-y:auto; flex:1;"></div>
  </div>

  <div id="adminModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#222; color:white; padding:30px; border-radius:12px; z-index:5001; border:1px solid #444; width:320px;">
    <h3 style="margin-bottom:15px;">Admin Style</h3>
    <input type="color" id="bubbleColorInput" style="width:100%; height:40px; margin-bottom:10px;">
    <input type="color" id="nameColorInput" style="width:100%; height:40px; margin-bottom:10px;">
    <label><input type="checkbox" id="gradientToggle"> Gradient</label><br>
    <label><input type="checkbox" id="animateToggle"> Animation</label><br><br>
    <button onclick="saveAdminSettings()" style="width:100%; padding:10px; background:#4285f4; border:none; color:white; border-radius:5px;">Save</button>
  </div>
  <div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:5000;" onclick="closeAdminSettings()"></div>

  <div id="topActions" style="position: fixed; top: 75px; right: 20px; z-index: 10; display: flex; gap: 10px;">
    <button id="adminClearBtn" onclick="clearChat()" style="display:none; background:#ea4335; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;">CLEAR CHAT</button>
    <button onclick="toggleMemberList()" style="background:#4285f4; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer;">👥 Members</button>
    <button id="adminSettingsBtn" onclick="openAdminSettings()" style="display:none; background:#333; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer;">⚙️</button>
  </div>

  <div id="chatBox"></div>
  <div id="typingIndicator"></div>

  <div id="messageInputBox">
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()" style="padding:12px 25px; background:#4285f4; color:white; border:none; border-radius:30px; cursor:pointer; font-weight:bold;">Send</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push, remove, set, update, onChildAdded, onChildRemoved, onValue, get, child, serverTimestamp, query, orderByChild } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null, currentUsername = "User", isAdmin = false, isBanned = false;
    let adminSettings = { gradient: true, animate: true, bubbleColor: "#667eea", nameColor: "#ffffff" };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'Home.html'; return; }
      currentUser = user;

      onValue(ref(database, `users/${user.uid}`), (snap) => {
        const data = snap.val() || {};
        currentUsername = data.username || user.email.split('@')[0];
        isAdmin = data.isAdmin === true;
        isBanned = data.isBanned === true;

        if (data.kicked && !isAdmin) {
          alert("You have been banned.");
          signOut(auth).then(() => window.location.href = 'Home.html');
          return;
        }

        // UI Adjustments based on rank
        document.getElementById('adminClearBtn').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('adminSettingsBtn').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('messageInput').disabled = isBanned;
        document.getElementById('messageInput').placeholder = isBanned ? "YOU ARE MUTED" : "Type a message...";
        
        updateStatus(true);
      });

      onValue(ref(database, 'adminSettings/global'), (s) => { if(s.exists()) adminSettings = s.val(); });
      
      setupChat();
      setupTypingLogic();
    });

    function setupChat() {
      const messagesRef = query(ref(database, 'messages'), orderByChild('timestamp'));
      const chatBox = document.getElementById("chatBox");

      onChildAdded(messagesRef, (s) => {
        renderMessage(s.key, s.val());
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      onChildRemoved(ref(database, 'messages'), (s) => {
        const el = document.getElementById(`msg-${s.key}`);
        if (el) el.remove();
      });

      onValue(ref(database, 'online'), (snap) => {
          updateMemberList(snap.val() || {});
      });
    }

    async function renderMessage(id, msg) {
      const isOwn = currentUser && msg.userId === currentUser.uid;
      const div = document.createElement("div");
      div.id = `msg-${id}`;
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      
      if (msg.isAdminMsg && msg.style) {
        if (msg.style.gradient) {
          div.classList.add('admin-gradient');
          if (msg.style.animate) div.classList.add('animate');
        } else { div.style.background = msg.style.bubbleColor; }
      }

      const userSpan = document.createElement("span");
      userSpan.className = "message-user" + (isAdmin ? " admin-viewable" : "");
      userSpan.textContent = isOwn ? "You" : msg.username;
      if (msg.isAdminMsg && msg.style?.nameColor) userSpan.style.color = msg.style.nameColor;

      if (isAdmin && !isOwn) {
        const tooltip = document.createElement("div");
        tooltip.className = "admin-tooltip";
        tooltip.innerHTML = `
          <b>${msg.email}</b><br>
          <button style="background:#ff8800; border:none; color:white; padding:4px; margin:2px; cursor:pointer;" onclick="adminMute('${msg.userId}')">Mute/Unmute</button>
          <button style="background:#ea4335; border:none; color:white; padding:4px; margin:2px; cursor:pointer;" onclick="adminBan('${msg.userId}')">Ban</button>
        `;
        userSpan.appendChild(tooltip);
      }

      const textDiv = document.createElement("div");
      textDiv.textContent = msg.text;

      if (isAdmin || isOwn) {
        const del = document.createElement("span");
        del.style = "color:rgba(128,128,128,0.5); margin-left:10px; cursor:pointer;";
        del.innerHTML = "&times;";
        del.onclick = () => remove(ref(database, `messages/${id}`));
        textDiv.appendChild(del);
      }

      div.append(userSpan, textDiv);
      document.getElementById("chatBox").appendChild(div);
    }

    // --- Typing Logic ---
    let typingTimeout;
    function setupTypingLogic() {
      const input = document.getElementById('messageInput');
      input.addEventListener('input', () => {
        if (currentUser) {
          set(ref(database, `typing/${currentUser.uid}`), { username: currentUsername, isTyping: true });
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => {
            set(ref(database, `typing/${currentUser.uid}`), null);
          }, 2000);
        }
      });

      onValue(ref(database, 'typing'), (snap) => {
        const typingData = snap.val() || {};
        const typingUsers = Object.values(typingData)
          .filter(u => u.username !== currentUsername)
          .map(u => u.username);
        
        const indicator = document.getElementById('typingIndicator');
        if (typingUsers.length > 0) {
          indicator.textContent = typingUsers.join(', ') + (typingUsers.length > 1 ? " are typing..." : " is typing...");
        } else {
          indicator.textContent = "";
        }
      });
    }

    async function updateMemberList(onlineData) {
      const content = document.getElementById('memberListContent');
      content.innerHTML = '';
      let count = 0;

      for (const [uid, data] of Object.entries(onlineData)) {
        if (!data.isOnline) continue;
        count++;

        const userSnap = await get(child(ref(database), `users/${uid}`));
        const isMuted = userSnap.val()?.isBanned === true;

        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `<div class="member-name">${data.username} ${isMuted ? '<span style="color:#ff8800; font-size:10px;">[MUTED]</span>' : ''}</div>`;
        
        if (isAdmin && uid !== currentUser.uid) {
          const btn = document.createElement('button');
          btn.textContent = isMuted ? 'UNMUTE' : 'MUTE';
          btn.style = "background:#666; color:white; border:none; padding:4px 8px; font-size:10px; cursor:pointer;";
          btn.onclick = () => adminMute(uid);
          div.appendChild(btn);
        }
        content.appendChild(div);
      }
      document.getElementById('onlineCount').textContent = count;
    }

    window.adminMute = async (uid) => {
      const snap = await get(child(ref(database), `users/${uid}`));
      const status = snap.val()?.isBanned || false;
      update(ref(database, `users/${uid}`), { isBanned: !status });
    };

    window.adminBan = (uid) => {
      if(confirm("Permanently ban this user?")) update(ref(database, `users/${uid}`), { kicked: true });
    };

    window.clearChat = () => {
      if(confirm("Clear all messages?")) remove(ref(database, 'messages'));
    };

    window.sendMessage = () => {
      const input = document.getElementById("messageInput");
      if(!input.value.trim() || isBanned) return;
      push(ref(database, 'messages'), {
        text: input.value,
        username: currentUsername,
        userId: currentUser.uid,
        email: currentUser.email,
        isAdminMsg: isAdmin,
        style: isAdmin ? adminSettings : null,
        timestamp: serverTimestamp()
      });
      input.value = "";
      set(ref(database, `typing/${currentUser.uid}`), null);
    };

    window.toggleMemberList = () => document.getElementById('memberList').classList.toggle('open');
    window.openAdminSettings = () => { document.getElementById('modalOverlay').style.display = 'block'; document.getElementById('adminModal').style.display = 'block'; };
    window.closeAdminSettings = () => { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('adminModal').style.display = 'none'; };
    window.saveAdminSettings = () => {
      const s = {
        gradient: document.getElementById('gradientToggle').checked,
        animate: document.getElementById('animateToggle').checked,
        bubbleColor: document.getElementById('bubbleColorInput').value,
        nameColor: document.getElementById('nameColorInput').value
      };
      update(ref(database, 'adminSettings/global'), s);
      closeAdminSettings();
    };

    function updateStatus(online) {
      if(currentUser) set(ref(database, `online/${currentUser.uid}`), { username: currentUsername, isOnline: online, lastSeen: serverTimestamp() });
    }
    
    document.getElementById("messageInput").addEventListener("keypress", (e) => { if(e.key === 'Enter') sendMessage(); });
    window.onbeforeunload = () => updateStatus(false);
  </script>
  <script src="particles.js"></script>
</body>
</html>
