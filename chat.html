<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Secure Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div id="chatBox"></div>
    <div id="typingIndicator"></div>

    <div id="messageInputBox">
        <label for="fileInput" class="file-btn">📷</label>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
        
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" class="send-btn">➤</button>
    </div>
    
    <div id="uploadProgress"></div>

    <div id="profileModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content profile-card" onclick="event.stopPropagation()">
            <div class="card-header-bg"></div>
            <img id="modalPfp" class="big-pfp">
            <h2 id="modalName">User</h2>
            <p id="modalBio" style="font-style:italic; margin-top:10px;">"No bio set."</p>
        </div>
    </div>

    <div id="mediaModal" class="modal" onclick="this.style.display='none'">
        <div style="position:relative; max-width:90%; max-height:90%;">
            <img id="expandedImg" style="max-width:100%; max-height:80vh; border-radius:8px; display:none;">
            <video id="expandedVideo" controls style="max-width:100%; max-height:80vh; border-radius:8px; display:none;"></video>
        </div>
    </div>

    <script src="particles.js"></script>
    <script type="module" src="global.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, push, remove, set, update, onChildAdded, onChildRemoved, onValue, get, serverTimestamp, query, orderByChild } 
        from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
            authDomain: "chat-or-somethig.firebaseapp.com",
            databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
            projectId: "chat-or-somethig",
            storageBucket: "chat-or-somethig.firebasestorage.app",
            messagingSenderId: "598777875087",
            appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null, currentUsername = "Guest", currentPfp = "", isAdmin = false, isBanned = false;

        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            currentUser = user;
            
            onValue(ref(db, `users/${user.uid}`), (snap) => {
                const data = snap.val() || {};
                currentUsername = data.username || user.email.split('@')[0];
                isAdmin = data.isAdmin === true;
                isBanned = data.isBanned === true;
                
                const input = document.getElementById('messageInput');
                input.disabled = isBanned;
                if(isBanned) input.placeholder = "YOU ARE MUTED";
            });

            setupChat();
            setupTyping();
            setupFileUpload();
        });

        function setupChat() {
            const q = query(ref(db, 'messages'), orderByChild('timestamp'));
            onChildAdded(q, (snapshot) => {
                renderMessage(snapshot.key, snapshot.val());
                const box = document.getElementById("chatBox");
                box.scrollTop = box.scrollHeight;
            });
            onChildRemoved(ref(db, 'messages'), (snapshot) => {
                const el = document.getElementById(`row-${snapshot.key}`);
                if(el) el.remove();
            });
        }

        function renderMessage(key, msg) {
            const isOwn = (msg.userId === currentUser.uid);
            const row = document.createElement("div");
            row.id = `row-${key}`;
            row.className = `msg-row ${isOwn ? 'own' : 'other'}`;

            const bubble = document.createElement("div");
            bubble.className = `message ${isOwn ? 'own' : 'other'}`;
            
            // Text Content
            const content = document.createElement("div");
            content.textContent = msg.text || "";
            
            // Media Content
            if (msg.media) {
                const media = document.createElement(msg.mediaType === 'video' ? 'video' : 'img');
                media.src = msg.media;
                media.style.maxWidth = "100%";
                media.style.borderRadius = "8px";
                media.onclick = () => window.openMedia(msg.media, msg.mediaType);
                content.appendChild(media);
            }

            bubble.appendChild(content);
            row.appendChild(bubble);
            document.getElementById("chatBox").appendChild(row);
        }

        // Global Actions
        document.getElementById('sendBtn').onclick = () => {
            const txt = document.getElementById('messageInput').value;
            if(!txt.trim() || isBanned) return;
            push(ref(db, 'messages'), {
                text: txt,
                username: currentUsername,
                userId: currentUser.uid,
                timestamp: serverTimestamp()
            });
            document.getElementById('messageInput').value = "";
        };

        window.openMedia = (src, type) => {
            const m = document.getElementById('mediaModal');
            m.style.display = 'flex';
            if(type==='video') {
                document.getElementById('expandedVideo').style.display='block';
                document.getElementById('expandedVideo').src = src;
            } else {
                document.getElementById('expandedImg').style.display='block';
                document.getElementById('expandedImg').src = src;
            }
        };

        function setupTyping() {
            const inp = document.getElementById('messageInput');
            inp.addEventListener('input', () => {
                set(ref(db, `typing/${currentUser.uid}`), { username: currentUsername });
                setTimeout(() => set(ref(db, `typing/${currentUser.uid}`), null), 2000);
            });
            onValue(ref(db, 'typing'), (snap) => {
                const val = snap.val() || {};
                const names = Object.keys(val).filter(k => k !== currentUser.uid).map(k => val[k].username);
                document.getElementById('typingIndicator').textContent = names.length ? names.join(", ") + " typing..." : "";
            });
        }

        function setupFileUpload() {
            document.getElementById('fileInput').onchange = async (e) => {
                const file = e.target.files[0];
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", "z1d4s4al");
                const res = await fetch("https://api.cloudinary.com/v1_1/dcbo4oozo/upload", { method: "POST", body: formData });
                const data = await res.json();
                push(ref(db, 'messages'), {
                    username: currentUsername, userId: currentUser.uid,
                    media: data.secure_url, mediaType: data.resource_type,
                    timestamp: serverTimestamp()
                });
            };
        }
    </script>
</body>
</html>
