<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Global Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Chat-specific UI Styling */
    body { background: #0f0f0f; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    #chatContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 95%;
      margin: 80px auto 20px auto;
      background: rgba(25, 25, 25, 0.8);
      backdrop-filter: blur(15px);
      border: 1px solid #333;
      border-radius: 15px;
      overflow: hidden;
      z-index: 10;
    }

    #messageDisplay {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Message Bubbles */
    .message {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .my-message {
      align-self: flex-end;
      background: #4285f4;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .other-message {
      align-self: flex-start;
      background: #333;
      color: #eee;
      border-bottom-left-radius: 2px;
    }

    .sender-name {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
      display: block;
    }

    /* Input Area */
    #inputArea {
      padding: 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 12px 18px;
      border-radius: 25px;
      color: white;
      outline: none;
    }

    #sendBtn {
      background: #4285f4;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    #sendBtn:hover { background: #357ae8; transform: scale(1.05); }

    /* Custom Scrollbar */
    #messageDisplay::-webkit-scrollbar { width: 6px; }
    #messageDisplay::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <script src="global.js"></script>

  <div id="chatContainer">
    <div id="messageDisplay">
      <div style="text-align: center; color: #666; font-size: 13px; margin-top: 20px;">
        Welcome to the Global Nexus Chat
      </div>
    </div>
    
    <form id="inputArea">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { 
      getDatabase, ref, push, set, onChildAdded, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Same config as your call.html
    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let username = "";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'Home.html';
      } else {
        currentUser = user;
        username = user.email.split('@')[0];
        loadMessages();
      }
    });

    const chatForm = document.getElementById('inputArea');
    const messageInput = document.getElementById('messageInput');
    const messageDisplay = document.getElementById('messageDisplay');

    // Function to send a message
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();

      if (text !== "" && currentUser) {
        const messagesRef = ref(database, 'globalChat');
        push(messagesRef, {
          sender: username,
          uid: currentUser.uid,
          text: text,
          timestamp: serverTimestamp()
        });
        messageInput.value = "";
      }
    });

    // Function to listen for new messages
    function loadMessages() {
      const messagesRef = ref(database, 'globalChat');
      
      onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        displayMessage(data);
      });
    }

    // Function to render message to UI
    function displayMessage(data) {
      const isMe = data.uid === currentUser.uid;
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isMe ? 'my-message' : 'other-message'}`;
      
      messageDiv.innerHTML = `
        <span class="sender-name">${isMe ? 'You' : data.sender}</span>
        <div>${escapeHTML(data.text)}</div>
      `;
      
      messageDisplay.appendChild(messageDiv);
      
      // Auto-scroll to bottom
      messageDisplay.scrollTop = messageDisplay.scrollHeight;
    }

    // Helper to prevent script injection (XSS)
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }
  </script>

  <script src="particles.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
