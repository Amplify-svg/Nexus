<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Chat Layout --- */
    #chatBox {
      position: absolute; top: 70px; left: 0; right: 0; bottom: 85px;
      padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      z-index: 2;
    }
    
    #typingIndicator {
      position: fixed; bottom: 85px; left: 20px; font-size: 12px;
      font-style: italic; color: #888; height: 15px; z-index: 5;
    }

    /* Message Bubbles */
    .message {
      padding: 10px 15px; border-radius: 18px; max-width: 75%;
      word-wrap: break-word; animation: messageFade 0.3s ease; position: relative;
    }
    .message.own { background: #4285f4; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.other { background: #333; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    /* Admin Specials */
    .message.admin-gradient {
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      background-size: 300% 300%;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
    }
    .message.admin-gradient.animate { animation: gradientShift 6s ease infinite; }

    @keyframes messageFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    /* Admin Tooltip */
    .message-user { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: inline-block; position: relative; cursor: default; }
    .admin-viewable { text-decoration: underline dotted #4285f4; cursor: help; }

    .admin-tooltip {
      visibility: hidden; width: 180px; background-color: #222; color: #fff;
      text-align: center; border-radius: 6px; padding: 10px;
      position: absolute; z-index: 100; bottom: 125%; left: 0;
      opacity: 0; transition: opacity 0.2s; border: 1px solid #444; font-weight: normal; font-size: 11px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .message-user:hover .admin-tooltip { visibility: visible; opacity: 1; }

    .tooltip-btn { border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; margin: 5px 2px 0; color: white; font-weight: bold; width: 70px; }
    .btn-mute { background: #ff8800; }
    .btn-ban { background: #ea4335; }

    .delete-btn { color: rgba(255,255,255,0.4); margin-left: 8px; cursor: pointer; }
    
    /* Input Bar */
    #messageInputBox {
      position: fixed; left: 0; right: 0; bottom: 0; height: 80px;
      padding: 15px 20px; background: rgba(20,20,20,0.95);
      display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; z-index: 10;
    }
    #messageInput { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #444; background: #111; color: white; outline: none; }
    #messageInput:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Member List Drawer */
    #memberList {
      position: fixed; right: -320px; top: 0; width: 300px; height: 100vh;
      background: #1a1a1a; border-left: 1px solid #333; transition: 0.3s; z-index: 4000; padding: 20px;
      display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    #memberList.open { right: 0; }
    .member-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333; }
    .member-name { font-weight: bold; font-size: 14px; }
    .muted-tag { font-size: 10px; color: #ff8800; margin-left: 5px; }
    
    .close-drawer { background: none; border: none; color: #888; font-size: 28px; cursor: pointer; align-self: flex-end; margin-bottom: 10px; }
    .close-drawer:hover { color: white; }

    /* Admin Modals */
    #adminModal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #222; padding: 30px; border-radius: 12px; z-index: 5000; border: 1px solid #444; width: 350px;
    }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 4999; }
  </style>
</head>
<body class="dark-mode">

  <canvas id="particleCanvas" style="position:fixed; top:0; left:0; pointer-events:none; z-index:1;"></canvas>
  <script src="global.js"></script>

  <div class="modal-overlay" id="modalOverlay" onclick="closeAdminSettings()"></div>
  <div id="adminModal">
    <h3 style="margin-bottom:20px; text-align:center;">Admin Global Style</h3>
    <label style="font-size:12px; color:#888;">BUBBLE COLOR</label>
    <input type="color" id="bubbleColorInput" style="width:100%; height:40px; margin-bottom:15px; border:none; background:none;">
    <label style="font-size:12px; color:#888;">NAME COLOR</label>
    <input type="color" id="nameColorInput" style="width:100%; height:40px; margin-bottom:15px; border:none; background:none;">
    <label style="display:flex; align-items:center; gap:10px; margin-bottom:10px;"><input type="checkbox" id="gradientToggle"> Enable Gradient</label>
    <label style="display:flex; align-items:center; gap:10px; margin-bottom:20px;"><input type="checkbox" id="animateToggle"> Enable Animation</label>
    <button onclick="saveAdminSettings()" style="width:100%; padding:12px; background:#4285f4; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">SAVE SETTINGS</button>
  </div>

  <div id="memberList">
    <button class="close-drawer" onclick="toggleMemberList()">×</button>
    <h3 style="margin-bottom:15px;">Online Members (<span id="onlineCount">0</span>)</h3>
    <div id="memberListContent" style="overflow-y:auto; flex:1;"></div>
  </div>

  <div id="adminActions" style="position: fixed; top: 75px; right: 20px; z-index: 10; display: none; gap: 10px;">
    <button onclick="clearChat()" style="background:#ea4335; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">CLEAR CHAT</button>
    <button onclick="toggleMemberList()" style="background:#333; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer;">👥</button>
    <button onclick="openAdminSettings()" style="background:#333; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer;">⚙️</button>
  </div>

  <div id="chatBox"></div>
  <div id="typingIndicator"></div>

  <div id="messageInputBox">
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()" style="padding:12px 25px; background:#4285f4; color:white; border:none; border-radius:30px; cursor:pointer; font-weight:bold;">Send</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push, remove, set, update, onChildAdded, onChildRemoved, onValue, get, child, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null, currentUsername = "User", isAdmin = false, isBanned = false;
    let adminSettings = { gradient: true, animate: true, bubbleColor: "#667eea", nameColor: "#ffffff" };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      // Listen to Current User's Specific Data
      onValue(ref(database, `users/${user.uid}`), (snap) => {
        const data = snap.val() || {};
        currentUsername = data.username || user.email.split('@')[0];
        isAdmin = data.isAdmin === true;
        isBanned = data.isBanned === true;

        if (data.kicked && !isAdmin) {
          alert("You have been banned from this chat.");
          signOut(auth).then(() => window.location.href = 'index.html');
          return;
        }

        document.getElementById('adminActions').style.display = isAdmin ? 'flex' : 'none';
        document.getElementById('messageInput').disabled = isBanned;
        document.getElementById('messageInput').placeholder = isBanned ? "YOU ARE MUTED" : "Type a message...";
        
        updateStatus(true);
      });

      onValue(ref(database, 'adminSettings/global'), (s) => { if(s.exists()) adminSettings = s.val(); });
      setupChat();
    });

    function setupChat() {
      // Clear UI when clearing DB
      onChildRemoved(ref(database, 'messages'), (s) => {
        const el = document.getElementById(`msg-${s.key}`);
        if (el) el.remove();
      });

      onChildAdded(ref(database, 'messages'), (s) => {
        renderMessage(s.key, s.val());
        const chatBox = document.getElementById("chatBox");
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      // Member list logic
      onValue(ref(database, 'online'), (snap) => {
          updateMemberList(snap.val() || {});
      });
    }

    async function renderMessage(id, msg) {
      const isOwn = currentUser && msg.userId === currentUser.uid;
      const div = document.createElement("div");
      div.id = `msg-${id}`;
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      
      if (msg.isAdminMsg && msg.style) {
        if (msg.style.gradient) {
          div.classList.add('admin-gradient');
          if (msg.style.animate) div.classList.add('animate');
        } else { div.style.background = msg.style.bubbleColor; }
      }

      const userSpan = document.createElement("span");
      userSpan.className = "message-user" + (isAdmin ? " admin-viewable" : "");
      userSpan.textContent = isOwn ? "You" : msg.username;
      if (msg.isAdminMsg && msg.style?.nameColor) userSpan.style.color = msg.style.nameColor;

      // Admin Hover Tooltip
      if (isAdmin && !isOwn) {
        const userRef = await get(child(ref(database), `users/${msg.userId}`));
        const targetData = userRef.val() || {};
        const isMuted = targetData.isBanned === true;

        const tooltip = document.createElement("div");
        tooltip.className = "admin-tooltip";
        tooltip.innerHTML = `
          <b style="color:#4285f4">${msg.email || 'No Email'}</b><br>
          <button class="tooltip-btn btn-mute" onclick="adminMute('${msg.userId}', ${isMuted})">
            ${isMuted ? 'UNMUTE' : 'MUTE'}
          </button>
          <button class="tooltip-btn btn-ban" onclick="adminBan('${msg.userId}')">BAN</button>
        `;
        userSpan.appendChild(tooltip);
      }

      const textDiv = document.createElement("div");
      textDiv.textContent = msg.text;

      if (isAdmin || isOwn) {
        const del = document.createElement("span");
        del.className = "delete-btn"; del.innerHTML = " &times;";
        del.onclick = (e) => { e.stopPropagation(); remove(ref(database, `messages/${id}`)); };
        textDiv.appendChild(del);
      }

      div.append(userSpan, textDiv);
      document.getElementById("chatBox").appendChild(div);
    }

    async function updateMemberList(onlineData) {
      const content = document.getElementById('memberListContent');
      content.innerHTML = '';
      let count = 0;

      for (const [uid, data] of Object.entries(onlineData)) {
        if (!data.isOnline) continue;
        count++;

        // Get live mute status for the member list
        const userSnap = await get(child(ref(database), `users/${uid}`));
        const userFullData = userSnap.val() || {};
        const isMuted = userFullData.isBanned === true;

        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
            <div class="member-name">
                ${data.username} ${isMuted ? '<span class="muted-tag">[MUTED]</span>' : ''}
            </div>
        `;
        
        if (isAdmin && uid !== currentUser.uid) {
            const btnGroup = document.createElement('div');
            btnGroup.style.display = 'flex';
            btnGroup.style.gap = '5px';
            
            const muteBtn = document.createElement('button');
            muteBtn.textContent = isMuted ? 'UNMUTE' : 'MUTE';
            muteBtn.style = "background:#666; color:white; border:none; border-radius:4px; font-size:10px; padding:4px 8px; cursor:pointer;";
            muteBtn.onclick = () => adminMute(uid, isMuted);

            const banBtn = document.createElement('button');
            banBtn.textContent = 'BAN';
            banBtn.style = "background:#ea4335; color:white; border:none; border-radius:4px; font-size:10px; padding:4px 8px; cursor:pointer;";
            banBtn.onclick = () => adminBan(uid);

            btnGroup.append(muteBtn, banBtn);
            div.appendChild(btnGroup);
        }
        content.appendChild(div);
      }
      document.getElementById('onlineCount').textContent = count;
    }

    // --- Admin Actions ---
    window.adminMute = (uid, currentStatus) => {
      update(ref(database, `users/${uid}`), { isBanned: !currentStatus });
    };

    window.adminBan = (uid) => {
      if(confirm("Kick and permanently ban this user?")) {
          update(ref(database, `users/${uid}`), { kicked: true });
      }
    };

    window.clearChat = () => {
      if(confirm("DANGER: Are you sure you want to clear ALL messages?")) {
        remove(ref(database, 'messages')).then(() => {
            document.getElementById("chatBox").innerHTML = "";
        }).catch(err => alert("Permission Error: Check Firebase Rules. " + err.message));
      }
    };

    window.sendMessage = () => {
      const input = document.getElementById("messageInput");
      if(!input.value.trim() || isBanned) return;
      push(ref(database, 'messages'), {
        text: input.value,
        username: currentUsername,
        userId: currentUser.uid,
        email: currentUser.email,
        isAdminMsg: isAdmin,
        style: isAdmin ? adminSettings : null,
        timestamp: serverTimestamp()
      });
      input.value = "";
    };

    // --- UI Controls ---
    window.toggleMemberList = () => document.getElementById('memberList').classList.toggle('open');
    window.openAdminSettings = () => {
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('adminModal').style.display = 'block';
    };
    window.closeAdminSettings = () => {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('adminModal').style.display = 'none';
    };
    window.saveAdminSettings = () => {
        const s = {
            gradient: document.getElementById('gradientToggle').checked,
            animate: document.getElementById('animateToggle').checked,
            bubbleColor: document.getElementById('bubbleColorInput').value,
            nameColor: document.getElementById('nameColorInput').value
        };
        update(ref(database, 'adminSettings/global'), s);
        closeAdminSettings();
    };

    function updateStatus(online) { 
        if(currentUser) set(ref(database, `online/${currentUser.uid}`), { 
            username: currentUsername, 
            isOnline: online, 
            lastSeen: serverTimestamp() 
        }); 
    }
    
    document.getElementById("messageInput").addEventListener("keypress", (e) => { if(e.key === 'Enter') sendMessage(); });
    window.onbeforeunload = () => updateStatus(false);
  </script>
  
  <script src="particles.js"></script>
</body>
</html>
