<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* REMOVED: body { background: #0f0f0f; } - Let style.css handle it! */
    
    .settings-page {
      max-width: 700px;
      margin: 100px auto 40px;
      padding: 0 20px;
      z-index: 10;
      position: relative;
    }

    .settings-section {
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      transition: background 0.3s, border 0.3s;
    }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .settings-item:last-child { border-bottom: none; }

    .settings-label { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Ensure text color adapts */
    .settings-value { font-size: 16px; margin-top: 5px; }

    .reveal-link { color: #4285f4; cursor: pointer; font-size: 13px; text-decoration: underline; margin-left: 10px; }

    .edit-btn {
      background: rgba(128, 128, 128, 0.1);
      color: inherit;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      cursor: pointer;
      transition: 0.2s;
    }
    .edit-btn:hover { background: #4285f4; color: white; border-color: #4285f4; }

    .appearance-toggle { display: flex; gap: 10px; margin-top: 15px; }
    .toggle-option {
      flex: 1;
      padding: 12px;
      background: rgba(128, 128, 128, 0.1);
      border: 1px solid rgba(128, 128, 128, 0.3);
      color: #888;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
    }
    .toggle-option.active {
      background: rgba(66, 133, 244, 0.2);
      border-color: #4285f4;
      color: #4285f4;
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>
  <script src="global.js"></script>

  <div class="settings-page">
    <h2 style="margin-bottom: 30px; font-weight: 300;">Account Settings</h2>

    <div class="settings-section">
      <div class="settings-item">
        <div>
          <div class="settings-label">Email Address</div>
          <div class="settings-value">
            <span id="emailDisplay">********@gmail.com</span>
            <span class="reveal-link" id="emailRevealBtn">Reveal</span>
          </div>
        </div>
        <button class="edit-btn" id="editEmailBtn">Edit</button>
      </div>

      <div class="settings-item">
        <div>
          <div class="settings-label">Username</div>
          <div class="settings-value" id="usernameDisplay">username</div>
        </div>
        <button class="edit-btn" id="editUserBtn">Edit</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">System Appearance</div>
      <div class="appearance-toggle">
        <div class="toggle-option" id="lightMode">☀️ Light</div>
        <div class="toggle-option" id="darkMode">🌙 Dark</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, update, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // ... (Keep your firebaseConfig here) ...

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let storedEmail = "";

    onAuthStateChanged(auth, async user => {
      if (!user) window.location.href = "Home.html";
      currentUser = user;
      
      const snap = await get(child(ref(database), `users/${user.uid}`));
      const data = snap.val() || {};
      
      storedEmail = data.email || user.email;
      const username = data.username || "User";
      
      localStorage.setItem('userName', username);
      document.getElementById('usernameDisplay').textContent = username;
      
      if (data.appearance === "dark") {
          updateUIAppearance("dark");
      } else {
          updateUIAppearance("light");
      }
    });

    // ADDED THIS FUNCTION: It was missing in your snippet!
    function updateUIAppearance(mode) {
      const body = document.body;
      if (mode === 'dark') {
        body.classList.add('dark-mode');
        document.getElementById('darkMode').classList.add('active');
        document.getElementById('lightMode').classList.remove('active');
      } else {
        body.classList.remove('dark-mode');
        document.getElementById('lightMode').classList.add('active');
        document.getElementById('darkMode').classList.remove('active');
      }
    }

    document.getElementById('lightMode').onclick = () => saveAppearance('light');
    document.getElementById('darkMode').onclick = () => saveAppearance('dark');

    async function saveAppearance(mode) {
      updateUIAppearance(mode);
      localStorage.setItem('theme', mode); 
      if (currentUser) await update(ref(database, `users/${currentUser.uid}`), { appearance: mode });
    }

    document.getElementById('editUserBtn').onclick = async () => {
      const name = prompt("New username:");
      if (name) {
        await update(ref(database, `users/${currentUser.uid}`), { username: name });
        localStorage.setItem('userName', name); 
        location.reload();
      }
    };
    
    document.getElementById('emailRevealBtn').onclick = () => {
      const display = document.getElementById('emailDisplay');
      display.textContent = display.textContent.includes('*') ? storedEmail : "********@gmail.com";
    };
  </script>
  <script src="particles.js"></script>
</body>
</html>
