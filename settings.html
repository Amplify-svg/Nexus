<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Settings</title>
  <link rel="icon" type="image/png" href="icon.png"> 
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- Settings Page Layout --- */
    .settings-page {
      max-width: 700px;
      margin: 100px auto 40px;
      padding: 0 20px;
      z-index: 10;
      position: relative;
    }

    .settings-section {
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* Dark mode override */
    body.dark-mode .settings-section {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid #333;
    }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .settings-item:last-child { border-bottom: none; }
    .settings-label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .settings-value { font-size: 16px; margin-top: 5px; color: inherit; }

    .reveal-link { color: #4285f4; cursor: pointer; font-size: 13px; text-decoration: none; margin-left: 10px; font-weight: 600; }
    .reveal-link:hover { text-decoration: underline; }

    .edit-btn {
      background: rgba(66, 133, 244, 0.1);
      color: #4285f4;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid rgba(66, 133, 244, 0.2);
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
    }
    .edit-btn:hover { background: #4285f4; color: white; border-color: #4285f4; }

    /* Appearance Toggles */
    .appearance-toggle { display: flex; gap: 10px; margin-top: 15px; }
    .toggle-option {
      flex: 1; padding: 12px; background: rgba(128, 128, 128, 0.1);
      border: 1px solid rgba(128, 128, 128, 0.3); color: #888;
      border-radius: 10px; cursor: pointer; text-align: center; transition: 0.3s; font-weight: 600;
    }
    .toggle-option.active {
      background: rgba(66, 133, 244, 0.15); border-color: #4285f4; color: #4285f4;
    }

    /* Danger Zone */
    .danger-section { border: 1px solid rgba(234, 67, 53, 0.3) !important; }
    
    .danger-btn {
      width: 100%; padding: 14px; border-radius: 10px; font-weight: 800;
      cursor: pointer; transition: 0.3s; margin-top: 10px; border: 1px solid transparent;
      letter-spacing: 1px;
    }
    
    .logout-btn-full {
      background: rgba(234, 67, 53, 0.1); color: #ea4335; border: 1px solid rgba(234, 67, 53, 0.3);
    }
    .logout-btn-full:hover { background: #ea4335; color: white; }

    .delete-btn {
      background: transparent; color: #888; font-size: 12px; border: none;
      margin-top: 20px; text-decoration: underline; opacity: 0.5; cursor: pointer;
    }
    .delete-btn:hover { color: #ea4335; opacity: 1; }
  </style>
</head>
<body class="dark-mode">

  <canvas id="particleCanvas"></canvas>
  
  <script src="global.js"></script>

  <div class="settings-page">
    <h2 style="margin-bottom: 30px; font-weight: 300; letter-spacing: -1px; font-size: 32px;">System Settings</h2>

    <div class="settings-section">
      <div class="settings-item">
        <div>
          <div class="settings-label">Email Address</div>
          <div class="settings-value">
            <span id="emailDisplay">********@gmail.com</span>
            <span class="reveal-link" id="emailRevealBtn">Show</span>
          </div>
        </div>
      </div>

      <div class="settings-item">
        <div>
          <div class="settings-label">Username</div>
          <div class="settings-value" id="usernameDisplay">---</div>
        </div>
        <button class="edit-btn" id="editUserBtn">Change</button>
      </div>

      <div class="settings-item">
        <div>
          <div class="settings-label">Security</div>
          <div class="settings-value">Account Password</div>
        </div>
        <button class="edit-btn" id="changePassBtn">Update</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Visual Interface</div>
      <div class="appearance-toggle">
        <div class="toggle-option" id="lightMode">☀️ Light</div>
        <div class="toggle-option" id="darkMode">🌙 Dark</div>
      </div>
    </div>

    <div class="settings-section danger-section">
      <div class="settings-label" style="color: #ea4335;">Danger Zone</div>
      <p style="font-size: 12px; color: #888; margin: 8px 0 15px 0; line-height: 1.4;">
        Actions here are sensitive. Logout to clear your session, or delete your account to remove all data from Nexus servers.
      </p>
      
      <button class="danger-btn logout-btn-full" id="fullLogoutBtn">LOGOUT SESSION</button>
      
      <div style="text-align: center;">
        <button class="delete-btn" id="deleteAccountBtn">Permanently Delete Account</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser, updatePassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, update, child, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let currentUsername = "";
    let storedEmail = "";

    // --- Auth State Monitor ---
    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "Home.html";
        return;
      }
      currentUser = user;
      storedEmail = user.email;
      
      const snap = await get(child(ref(database), `users/${user.uid}`));
      const data = snap.val() || {};
      
      currentUsername = data.username || user.email.split('@')[0];
      
      // Update UI
      document.getElementById('usernameDisplay').textContent = currentUsername;
      localStorage.setItem('userName', currentUsername);
      
      // Sync Theme
      if (data.appearance === "dark") {
          updateUIAppearance("dark");
      } else {
          updateUIAppearance("light");
      }

      // Signal global.js navigation to refresh
      window.dispatchEvent(new Event('nameUpdated'));
    });

    // --- Username Update ---
    document.getElementById('editUserBtn').onclick = async () => {
      const newName = prompt("Enter new username:", currentUsername);
      if (newName && newName !== currentUsername) {
        await update(ref(database, `users/${currentUser.uid}`), { username: newName });
        localStorage.setItem('userName', newName);
        location.reload();
      }
    };

    // --- Password Update ---
    document.getElementById('changePassBtn').onclick = async () => {
        const newPass = prompt("Enter new password (min 6 chars):");
        if (!newPass || newPass.length < 6) {
            alert("Password too short or empty.");
            return;
        }
        const confirmPass = prompt("Confirm new password:");
        if (newPass !== confirmPass) {
            alert("Passwords do not match.");
            return;
        }

        try {
            await updatePassword(currentUser, newPass);
            alert("Password updated successfully.");
        } catch (err) {
            alert("Security Error: Please log out and log back in to verify your identity before changing passwords.");
        }
    };

    // --- Logout ---
    document.getElementById('fullLogoutBtn').onclick = async () => {
        if (confirm("Terminate current session?")) {
            localStorage.clear();
            sessionStorage.clear();
            await signOut(auth);
            window.location.replace("Home.html");
        }
    };

    // --- Delete Account ---
    document.getElementById('deleteAccountBtn').onclick = async () => {
        const confirmName = prompt(`WARNING: This is permanent. Type your username (${currentUsername}) to confirm deletion:`);
        
        if (confirmName === currentUsername) {
            try {
                const uid = currentUser.uid;
                await remove(ref(database, `users/${uid}`)); // Wipe DB entry
                await deleteUser(currentUser);              // Wipe Auth entry
                localStorage.clear();
                window.location.replace("Home.html");
            } catch (err) {
                alert("Sensitive Action: Please re-login to Nexus and try deleting again immediately.");
            }
        }
    };

    // --- Appearance Management ---
    function updateUIAppearance(mode) {
      if (mode === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkMode').classList.add('active');
        document.getElementById('lightMode').classList.remove('active');
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('lightMode').classList.add('active');
        document.getElementById('darkMode').classList.remove('active');
      }
    }

    document.getElementById('lightMode').onclick = () => saveTheme('light');
    document.getElementById('darkMode').onclick = () => saveTheme('dark');

    async function saveTheme(mode) {
      updateUIAppearance(mode);
      localStorage.setItem('theme', mode);
      if (currentUser) {
          await update(ref(database, `users/${currentUser.uid}`), { appearance: mode });
      }
    }

    // --- Email Reveal ---
    document.getElementById('emailRevealBtn').onclick = function() {
      const display = document.getElementById('emailDisplay');
      if (display.textContent.includes('*')) {
          display.textContent = storedEmail;
          this.textContent = "Hide";
      } else {
          display.textContent = "********@gmail.com";
          this.textContent = "Show";
      }
    };
  </script>

  <script src="particles.js"></script>
</body>
</html>
