<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Settings</title>
  <link rel="icon" type="image/png" href="icon.png"> 
  <link rel="stylesheet" href="style.css">
  <style>
    /* CSS specifically for the Settings layout */
    .settings-page {
      max-width: 700px;
      margin: 100px auto 40px;
      padding: 0 20px;
      z-index: 10;
      position: relative;
    }

    .settings-section {
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    body.dark-mode .settings-section {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid #333;
    }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(128, 128, 128, 0.2);
    }

    .settings-item:last-child { border-bottom: none; }
    .settings-label { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .settings-value { font-size: 16px; margin-top: 5px; }

    .reveal-link { color: #4285f4; cursor: pointer; font-size: 13px; text-decoration: underline; margin-left: 10px; }

    .edit-btn {
      background: rgba(128, 128, 128, 0.1);
      color: inherit;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      cursor: pointer;
      transition: 0.2s;
    }
    .edit-btn:hover { background: #4285f4; color: white; border-color: #4285f4; }

    .appearance-toggle { display: flex; gap: 10px; margin-top: 15px; }
    .toggle-option {
      flex: 1; padding: 12px; background: rgba(128, 128, 128, 0.1);
      border: 1px solid rgba(128, 128, 128, 0.3); color: #888;
      border-radius: 8px; cursor: pointer; text-align: center; transition: 0.3s;
    }
    .toggle-option.active {
      background: rgba(66, 133, 244, 0.2); border-color: #4285f4; color: #4285f4;
    }

    /* Danger Zone Styling */
    .danger-section { border: 1px solid rgba(234, 67, 53, 0.3) !important; }
    
    .danger-btn {
      width: 100%; padding: 12px; border-radius: 8px; font-weight: bold;
      cursor: pointer; transition: 0.3s; margin-top: 10px; border: 1px solid transparent;
    }
    
    .logout-btn-full {
      background: rgba(234, 67, 53, 0.1); color: #ea4335; border-color: #ea4335;
    }
    .logout-btn-full:hover { background: #ea4335; color: white; }

    .delete-btn {
      background: transparent; color: #888; font-size: 12px; border: none;
      margin-top: 15px; text-decoration: underline; opacity: 0.6;
    }
    .delete-btn:hover { color: #ea4335; opacity: 1; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>
  <script src="global.js"></script>

  <div class="settings-page">
    <h2 style="margin-bottom: 30px; font-weight: 300;">Account Settings</h2>

    <div class="settings-section">
      <div class="settings-item">
        <div>
          <div class="settings-label">Email Address</div>
          <div class="settings-value">
            <span id="emailDisplay">********@gmail.com</span>
            <span class="reveal-link" id="emailRevealBtn">Reveal</span>
          </div>
        </div>
        <button class="edit-btn" id="editEmailBtn">Edit</button>
      </div>

      <div class="settings-item">
        <div>
          <div class="settings-label">Username</div>
          <div class="settings-value" id="usernameDisplay">username</div>
        </div>
        <button class="edit-btn" id="editUserBtn">Edit</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">System Appearance</div>
      <div class="appearance-toggle">
        <div class="toggle-option" id="lightMode">☀️ Light</div>
        <div class="toggle-option" id="darkMode">🌙 Dark</div>
      </div>
    </div>

    <div class="settings-section danger-section">
      <div class="settings-label" style="color: #ea4335;">Danger Zone</div>
      <p style="font-size: 12px; color: #888; margin-top: 5px;">Manage your active session or permanently remove your data.</p>
      
      <button class="danger-btn logout-btn-full" id="fullLogoutBtn">LOGOUT FROM NEXUS</button>
      
      <div style="text-align: center;">
        <button class="delete-btn" id="deleteAccountBtn">Delete Account Permanently</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, get, update, child, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let currentUsername = "";
    let storedEmail = "";

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "rpg.html";
        return;
      }
      currentUser = user;
      
      const snap = await get(child(ref(database), `users/${user.uid}`));
      const data = snap.val() || {};
      
      storedEmail = data.email || user.email;
      currentUsername = data.username || "User";
      
      localStorage.setItem('userName', currentUsername);
      document.getElementById('usernameDisplay').textContent = currentUsername;
      
      window.dispatchEvent(new Event('nameUpdated'));
      
      updateUIAppearance(data.appearance === "dark" ? "dark" : "light");
    });

    // --- LOGOUT LOGIC ---
    document.getElementById('fullLogoutBtn').onclick = async () => {
        if (confirm("Are you sure you want to logout?")) {
            localStorage.clear();
            sessionStorage.clear();
            await signOut(auth);
            window.location.replace("rpg.html");
        }
    };

    // --- DELETE ACCOUNT LOGIC ---
    document.getElementById('deleteAccountBtn').onclick = async () => {
        const confirmation = prompt(`To delete your account, type your username (${currentUsername}) below:`);
        
        if (confirmation === currentUsername) {
            try {
                // 1. Remove from Realtime Database
                await remove(ref(database, `users/${currentUser.uid}`));
                
                // 2. Delete Auth User
                await deleteUser(currentUser);
                
                localStorage.clear();
                alert("Account successfully deleted.");
                window.location.replace("rpg.html");
            } catch (err) {
                alert("For security, you must have logged in recently to delete your account. Please log out and back in, then try again.");
            }
        } else if (confirmation !== null) {
            alert("Username incorrect. Deletion cancelled.");
        }
    };

    // --- UI & THEME LOGIC ---
    function updateUIAppearance(mode) {
      if (mode === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkMode').classList.add('active');
        document.getElementById('lightMode').classList.remove('active');
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('lightMode').classList.add('active');
        document.getElementById('darkMode').classList.remove('active');
      }
    }

    document.getElementById('lightMode').onclick = () => saveAppearance('light');
    document.getElementById('darkMode').onclick = () => saveAppearance('dark');

    async function saveAppearance(mode) {
      updateUIAppearance(mode);
      localStorage.setItem('theme', mode); 
      if (currentUser) {
        await update(ref(database, `users/${currentUser.uid}`), { appearance: mode });
      }
    }

    document.getElementById('editUserBtn').onclick = async () => {
      const name = prompt("New username:");
      if (name) {
        await update(ref(database, `users/${currentUser.uid}`), { username: name });
        localStorage.setItem('userName', name); 
        window.dispatchEvent(new Event('nameUpdated'));
        location.reload();
      }
    };

    document.getElementById('emailRevealBtn').onclick = () => {
      const display = document.getElementById('emailDisplay');
      display.textContent = display.textContent.includes('*') ? storedEmail : "********@gmail.com";
    };
  </script>
  <script src="particles.js"></script>
</body>
</html>
