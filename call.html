<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Video Call</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Specific styling for the Video Call components */
    body { background: #0f0f0f; color: white; overflow: hidden; }
    
    #callOverlay { 
      display: none; position: fixed; inset: 0; 
      background: rgba(0,0,0,0.95); z-index: 2000; 
      flex-direction: column; align-items: center; justify-content: center; 
    }
    .video-grid { display: flex; gap: 15px; width: 90%; max-width: 1200px; height: 60vh; position: relative; }
    #remoteVideo { flex: 1; background: #000; border-radius: 15px; object-fit: cover; }
    #localVideo { 
      position: absolute; width: 200px; height: 150px; 
      bottom: 20px; right: 20px; border: 3px solid #4285f4; 
      border-radius: 12px; object-fit: cover; transform: scaleX(-1); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    .controls { margin-top: 30px; display: flex; gap: 20px; }
    .btn-call { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; transition: 0.2s; }
    .btn-call:hover { transform: scale(1.1); }
    
    #memberList { 
      position: fixed; right: -320px; top: 60px; width: 300px; bottom: 0; 
      background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); 
      transition: 0.3s; padding: 20px; z-index: 99; border-left: 1px solid #333; 
    }
    #memberList.open { right: 0; }
    .user-item { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 12px; margin-bottom: 10px; background: #2a2a2a; border-radius: 10px; 
    }
    .call-btn-small { background: #4285f4; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }

    /* Button to trigger the member list */
    .toggle-members {
        position: fixed; top: 75px; right: 20px; z-index: 101;
        background: #4285f4; color: white; padding: 10px 20px; border-radius: 5px;
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <button class="toggle-members" onclick="toggleList()">👥 Online Users</button>

  <div id="memberList">
    <h3 style="margin-bottom: 20px;">Available Peers</h3>
    <div id="onlineUsers"></div>
  </div>

  <div id="callOverlay">
    <h2 id="callStatus" style="margin-bottom: 20px;">Connecting...</h2>
    <div class="video-grid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="controls">
      <button id="acceptBtn" class="btn-call" style="background:#31a24c; display:none;" onclick="answerCall()">📞</button>
      <button class="btn-call" style="background:#fa3e3e;" onclick="hangUp()">🚫</button>
    </div>
  </div>

  <script src="global.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update, onChildAdded } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Re-use your config
    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null, currentUsername = "";
    let localStream = null, pc = null;

    const servers = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" }
      ]
    };

    // Sync with your Auth logic
    onAuthStateChanged(auth, (user) => {
      if (!user) { location.href = 'Home.html'; return; }
      currentUser = user;
      currentUsername = user.email.split('@')[0];
      
      // Mark as online specifically for calling
      set(ref(database, `online/${user.uid}`), { name: currentUsername });
      
      // Cleanup when closing tab
      onDisconnect(ref(database, `online/${user.uid}`)).remove();

      onValue(ref(database, `calls/${user.uid}`), (snap) => {
        const data = snap.val();
        if (data && data.offer && !pc) {
          window.incomingCallData = data;
          document.getElementById("callOverlay").style.display = "flex";
          document.getElementById("callStatus").textContent = "Call from " + data.name;
          document.getElementById("acceptBtn").style.display = "block";
        }
      });
    });

    // --- VIDEO ENGINE ---
    async function startMedia() {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById("localVideo").srcObject = localStream;
    }

    window.startCall = async (targetUid) => {
      document.getElementById("callOverlay").style.display = "flex";
      document.getElementById("callStatus").textContent = "Calling...";
      await startMedia();

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => document.getElementById("remoteVideo").srcObject = e.streams[0];
      
      pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(database, `calls/${targetUid}/candidates`), e.candidate.toJSON());
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      set(ref(database, `calls/${targetUid}`), { 
          offer: { type: offer.type, sdp: offer.sdp }, 
          name: currentUsername, 
          from: currentUser.uid 
      });

      onValue(ref(database, `calls/${targetUid}`), async (s) => {
        const data = s.val();
        if (data?.answer && pc) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          document.getElementById("callStatus").textContent = "Connected";
        }
      });
    };

    window.answerCall = async () => {
      await startMedia();
      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => document.getElementById("remoteVideo").srcObject = e.streams[0];

      pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(database, `calls/${window.incomingCallData.from}/candidates`), e.candidate.toJSON());
      };

      await pc.setRemoteDescription(new RTCSessionDescription(window.incomingCallData.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      update(ref(database, `calls/${currentUser.uid}`), { answer: { type: answer.type, sdp: answer.sdp } });
      
      document.getElementById("callStatus").textContent = "Connected";
      document.getElementById("acceptBtn").style.display = "none";
    };

    window.hangUp = () => {
      if(localStream) localStream.getTracks().forEach(t => t.stop());
      if(pc) { pc.close(); pc = null; }
      remove(ref(database, `calls/${currentUser.uid}`));
      document.getElementById("callOverlay").style.display = "none";
    };

    window.toggleList = () => document.getElementById("memberList").classList.toggle("open");
    
    onValue(ref(database, 'online'), (s) => {
      const users = s.val() || {};
      const cont = document.getElementById("onlineUsers");
      cont.innerHTML = "";
      Object.keys(users).forEach(uid => {
        if(uid === currentUser.uid) return;
        const div = document.createElement("div");
        div.className = "user-item";
        div.innerHTML = `<span>${users[uid].name}</span> <button class="call-btn-small" onclick="startCall('${uid}')">📞</button>`;
        cont.appendChild(div);
      });
    });
  </script>
  
  <script src="particles.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
