<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Video Call</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Specific styling for the Video Call components */
    body { background: #0f0f0f; color: white; overflow: hidden; }
    
    #callOverlay { 
      display: none; position: fixed; inset: 0; 
      background: rgba(0,0,0,0.95); z-index: 2000; 
      flex-direction: column; align-items: center; justify-content: center; 
    }
    .video-grid { display: flex; gap: 15px; width: 90%; max-width: 1200px; height: 65vh; position: relative; margin-top: 20px; }
    #remoteVideo { flex: 1; background: #000; border-radius: 15px; object-fit: cover; border: 1px solid #333; }
    #localVideo { 
      position: absolute; width: 220px; height: 165px; 
      bottom: 20px; right: 20px; border: 3px solid #4285f4; 
      border-radius: 12px; object-fit: cover; transform: scaleX(-1); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }
    .controls { margin-top: 30px; display: flex; gap: 20px; }
    .btn-call { width: 65px; height: 65px; border-radius: 50%; border: none; cursor: pointer; font-size: 28px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-call:hover { transform: scale(1.1); }
    
    #memberList { 
      position: fixed; right: -320px; top: 60px; width: 300px; bottom: 0; 
      background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); 
      transition: 0.3s; padding: 20px; z-index: 99; border-left: 1px solid #333; 
    }
    #memberList.open { right: 0; }
    .user-item { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 12px; margin-bottom: 10px; background: #2a2a2a; border-radius: 10px; 
    }
    .call-btn-small { background: #4285f4; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    .toggle-members {
        position: fixed; top: 75px; right: 20px; z-index: 101;
        background: #4285f4; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <script src="global.js"></script>

  <canvas id="particleCanvas"></canvas>

  <button class="toggle-members" onclick="toggleList()">👥 Online Users</button>

  <div id="memberList">
    <h3 style="margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px;">Peers Online</h3>
    <div id="onlineUsers"></div>
  </div>

  <div id="callOverlay">
    <h2 id="callStatus" style="margin-bottom: 10px; font-weight: 300; letter-spacing: 1px;">Connecting...</h2>
    <div class="video-grid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="controls">
      <button id="acceptBtn" class="btn-call" style="background:#31a24c; display:none;" onclick="answerCall()">📞</button>
      <button class="btn-call" style="background:#fa3e3e;" onclick="hangUp()">🚫</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { 
      getDatabase, ref, push, set, onValue, remove, update, onChildAdded, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null, currentUsername = "";
    let localStream = null, pc = null;

    // --- METERED.CA ICE SERVERS CONFIGURATION ---
    const servers = {
      iceServers: [
        { urls: "stun:stun.relay.metered.ca:80" },
        {
          urls: "turn:global.relay.metered.ca:80",
          username: "d6ae3995067cce03160efd7e",
          credential: "BRRHc7HHxoZC/OB+",
        },
        {
          urls: "turn:global.relay.metered.ca:80?transport=tcp",
          username: "d6ae3995067cce03160efd7e",
          credential: "BRRHc7HHxoZC/OB+",
        },
        {
          urls: "turn:global.relay.metered.ca:443",
          username: "d6ae3995067cce03160efd7e",
          credential: "BRRHc7HHxoZC/OB+",
        },
        {
          urls: "turns:global.relay.metered.ca:443?transport=tcp",
          username: "d6ae3995067cce03160efd7e",
          credential: "BRRHc7HHxoZC/OB+",
        },
      ],
      iceCandidatePoolSize: 10,
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'Home.html'; return; }
      currentUser = user;
      currentUsername = user.email.split('@')[0];
      
      const myPresenceRef = ref(database, `online/${user.uid}`);
      set(myPresenceRef, { name: currentUsername, uid: user.uid });
      onDisconnect(myPresenceRef).remove();

      onValue(ref(database, `calls/${user.uid}`), (snap) => {
        const data = snap.val();
        if (data && data.offer && !pc) {
          window.incomingCallData = data;
          document.getElementById("callOverlay").style.display = "flex";
          document.getElementById("callStatus").textContent = "Incoming: " + data.name;
          document.getElementById("acceptBtn").style.display = "block";
        }
      });
    });

    async function startMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
      } catch (e) {
        alert("Camera access failed. Check permissions.");
      }
    }

    window.startCall = async (targetUid) => {
      document.getElementById("callOverlay").style.display = "flex";
      document.getElementById("callStatus").textContent = "Calling...";
      await startMedia();

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      
      pc.ontrack = (e) => document.getElementById("remoteVideo").srcObject = e.streams[0];
      pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(database, `calls/${targetUid}/candidates`), e.candidate.toJSON());
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      
      set(ref(database, `calls/${targetUid}`), { 
          offer: { type: offer.type, sdp: offer.sdp }, 
          name: currentUsername, 
          from: currentUser.uid 
      });

      onValue(ref(database, `calls/${targetUid}`), async (s) => {
        const data = s.val();
        if (data?.answer && pc && pc.signalingState === "have-local-offer") {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          document.getElementById("callStatus").textContent = "Connected";
        }
      });
    };

    window.answerCall = async () => {
      await startMedia();
      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => document.getElementById("remoteVideo").srcObject = e.streams[0];

      pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(database, `calls/${window.incomingCallData.from}/candidates`), e.candidate.toJSON());
      };

      await pc.setRemoteDescription(new RTCSessionDescription(window.incomingCallData.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      
      update(ref(database, `calls/${currentUser.uid}`), { 
        answer: { type: answer.type, sdp: answer.sdp } 
      });

      onChildAdded(ref(database, `calls/${currentUser.uid}/candidates`), (s) => {
        if (pc && s.val()) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e => {});
      });
      
      document.getElementById("callStatus").textContent = "Connected";
      document.getElementById("acceptBtn").style.display = "none";
    };

    window.hangUp = () => {
      if(localStream) localStream.getTracks().forEach(t => t.stop());
      if(pc) { pc.close(); pc = null; }
      if(currentUser) remove(ref(database, `calls/${currentUser.uid}`));
      document.getElementById("callOverlay").style.display = "none";
    };

    window.toggleList = () => document.getElementById("memberList").classList.toggle("open");
    
    onValue(ref(database, 'online'), (s) => {
      const users = s.val() || {};
      const cont = document.getElementById("onlineUsers");
      cont.innerHTML = "";
      Object.keys(users).forEach(uid => {
        if(currentUser && uid === currentUser.uid) return;
        const div = document.createElement("div");
        div.className = "user-item";
        div.innerHTML = `<span>${users[uid].name}</span><button class="call-btn-small" onclick="startCall('${uid}')">📞</button>`;
        cont.appendChild(div);
      });
    });
  </script>
  
  <script src="particles.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
