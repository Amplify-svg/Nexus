<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Video Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; overflow: hidden; }
    
    .header { position: fixed; top: 0; width: 100%; height: 60px; background: #1f1f1f; display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #333; }
    .status-dot { width: 10px; height: 10px; background: #31a24c; border-radius: 50%; display: inline-block; margin-right: 8px; }

    #memberList { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); width: 90%; max-width: 400px; background: #1f1f1f; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: #2b2b2b; border-radius: 8px; }
    .call-btn { background: #0084ff; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    #callOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
    .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #111; }
    #localVideo { position: absolute; width: 180px; height: 135px; bottom: 100px; right: 20px; border: 2px solid #0084ff; border-radius: 10px; object-fit: cover; transform: scaleX(-1); background: #222; }
    
    .call-ui { position: absolute; bottom: 30px; display: flex; gap: 20px; z-index: 2001; }
    .btn-action { width: 65px; height: 65px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; color: white; }
    #acceptBtn { background: #31a24c; }
    #hangupBtn { background: #fa3e3e; }
    #callStatus { position: absolute; top: 40px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 2002; }

    #debugLog { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: #555; pointer-events: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="status-dot"></div>
    <span id="uName">Connecting to Firebase...</span>
  </div>

  <div id="memberList">
    <h3 style="margin-bottom: 15px; text-align: center;">Online Users</h3>
    <div id="onlineUsers">
      <p style="color: #888; text-align: center;">Waiting for others to join...</p>
    </div>
  </div>

  <div id="callOverlay">
    <div id="callStatus">Establishing Connection...</div>
    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-ui">
      <button id="acceptBtn" class="btn-action" onclick="answerCall()">📞</button>
      <button id="hangupBtn" class="btn-action" onclick="hangUp()">🚫</button>
    </div>
  </div>

  <div id="debugLog">System Ready</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update, onChildAdded, onDisconnect } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN8ypq4TxhLwjseqnDJneBO2j_BlARz0M",
      authDomain: "chat-or-somethig.firebaseapp.com",
      databaseURL: "https://chat-or-somethig-default-rtdb.firebaseio.com",
      projectId: "chat-or-somethig",
      storageBucket: "chat-or-somethig.firebasestorage.app",
      messagingSenderId: "598777875087",
      appId: "1:598777875087:web:d100536dd269bc0a9d7efa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null, currentUsername = "";
    let localStream = null, pc = null;
    let targetId = null;

    const servers = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    function log(msg) {
        console.log(msg);
        document.getElementById('debugLog').innerText = msg;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      currentUsername = user.email.split('@')[0];
      document.getElementById("uName").textContent = currentUsername;
      log("Logged in as: " + currentUsername);

      const myPresenceRef = ref(database, `online/${user.uid}`);
      set(myPresenceRef, { name: currentUsername, uid: user.uid });
      onDisconnect(myPresenceRef).remove();

      listenForIncomingCalls();
      listenForOnlineUsers();
    });

    async function startMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
        return true;
      } catch (e) {
        log("Media Error: " + e.message);
        alert("Camera/Mic access denied or not on HTTPS.");
        return false;
      }
    }

    // --- CALLER SIDE ---
    window.startCall = async (uid) => {
      targetId = uid;
      document.getElementById("callOverlay").style.display = "flex";
      document.getElementById("acceptBtn").style.display = "none";
      document.getElementById("callStatus").textContent = "Calling...";

      if (!(await startMedia())) return;

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = (event) => {
        log("Received remote video stream");
        document.getElementById("remoteVideo").srcObject = event.streams[0];
        document.getElementById("callStatus").textContent = "Connected";
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          log("Sending ICE candidate to receiver");
          push(ref(database, `calls/${uid}/candidates`), event.candidate.toJSON());
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const callRef = ref(database, `calls/${uid}`);
      log("Setting offer in Firebase...");
      set(callRef, {
        offer: { type: offer.type, sdp: offer.sdp },
        from: currentUser.uid,
        name: currentUsername
      }).catch(err => log("Firebase Set Error: " + err.message));

      onValue(callRef, async (snap) => {
        const data = snap.val();
        if (data?.answer && pc.signalingState === "have-local-offer") {
          log("Answer received, setting remote description");
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
      });

      onChildAdded(ref(database, `calls/${uid}/remoteCandidates`), (snap) => {
        if (pc && snap.val()) {
            log("Adding candidate from receiver");
            pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
        }
      });
    };

    // --- RECEIVER SIDE ---
    function listenForIncomingCalls() {
      onValue(ref(database, `calls/${currentUser.uid}`), (snap) => {
        const data = snap.val();
        if (data && data.offer && !pc) {
          window.incomingCall = data;
          document.getElementById("callOverlay").style.display = "flex";
          document.getElementById("callStatus").textContent = "Incoming Call: " + data.name;
          document.getElementById("acceptBtn").style.display = "flex";
          log("Call detected from " + data.name);
        } else if (!data && pc) {
          log("Call ended by remote party");
          hangUp(); 
        }
      });
    }

    window.answerCall = async () => {
      if (!window.incomingCall) return;
      document.getElementById("acceptBtn").style.display = "none";
      document.getElementById("callStatus").textContent = "Connecting...";

      if (!(await startMedia())) return;

      const callData = window.incomingCall;
      targetId = callData.from;

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = (event) => {
        document.getElementById("remoteVideo").srcObject = event.streams[0];
        document.getElementById("callStatus").textContent = "Connected";
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          log("Sending candidate back to caller");
          push(ref(database, `calls/${targetId}/remoteCandidates`), event.candidate.toJSON());
        }
      };

      onChildAdded(ref(database, `calls/${currentUser.uid}/candidates`), (snap) => {
        if (pc && snap.val()) {
            log("Adding candidate from caller");
            pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
        }
      });

      log("Answering call, setting remote offer");
      await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      update(ref(database, `calls/${currentUser.uid}`), {
        answer: { type: answer.type, sdp: answer.sdp }
      });
    };

    window.hangUp = () => {
      log("Hanging up call");
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (pc) { pc.close(); pc = null; }
      
      remove(ref(database, `calls/${currentUser.uid}`));
      if (targetId) remove(ref(database, `calls/${targetId}`));
      
      document.getElementById("callOverlay").style.display = "none";
      document.getElementById("remoteVideo").srcObject = null;
      window.incomingCall = null;
      targetId = null;
    };

    function listenForOnlineUsers() {
      onValue(ref(database, 'online'), (snap) => {
        const users = snap.val() || {};
        const container = document.getElementById("onlineUsers");
        container.innerHTML = "";
        
        const others = Object.keys(users).filter(uid => uid !== currentUser.uid);

        if (others.length === 0) {
          container.innerHTML = `<p style="color:#888; text-align:center;">No one else is online.</p>`;
          return;
        }

        others.forEach(uid => {
          const div = document.createElement("div");
          div.className = "user-item";
          div.innerHTML = `
            <span>${users[uid].name}</span>
            <button class="call-btn" onclick="startCall('${uid}')">📞 Call</button>
          `;
          container.appendChild(div);
        });
      });
    }
  </script>
</body>
</html>
