
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy - Secure Browser</title>
  <style>
    /* --- Clean Layout --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; font-family: sans-serif; }

    /* --- Navigation Bar --- */
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid #333;
    }

    .back-btn {
      background: #4285f4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .back-btn:hover { background: #357abd; transform: scale(1.05); }

    .status-text {
      margin-left: 20px;
      color: #888;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* --- Proxy Container --- */
    .proxy-container {
      width: 100%;
      height: 100vh;
      padding-top: 50px; /* Space for the nav-bar */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Loading Spinner Overlay */
    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4285f4;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn">← Back to Nexus</a>
    <span class="status-text">SECURE PROXY TUNNEL ACTIVE</span>
  </div>

  <div id="loader">Initializing Proxy...</div>

  <div class="proxy-container">
    <iframe 
      src="https://proxy1-orcin.vercel.app/" 
      id="proxyFrame"
      onload="document.getElementById('loader').style.display='none';"
    ></iframe>
  </div>

  <script>
    // Security Tip: If the proxy gets blocked, you just change the URL in the <iframe> tag above.
    
    // Optional: Auto-focus the search bar inside the proxy if possible
    window.onload = () => {
      const frame = document.getElementById('proxyFrame');
      frame.focus();
    };
  </script>
</body>
</html>
